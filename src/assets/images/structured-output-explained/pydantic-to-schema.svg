<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="t">
<title id="t">Describe the form once. A short Pydantic class, User with name as text, age as a whole number and an optional email, is turned by Pydantic into a JSON Schema: name is a required string, age a required integer, and email a string or nothing. Way 1 hands that description to the AI company to enforce; Way 2 uses it in your own code to check the answer.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="238" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="50" width="240" height="120" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="34" y="86.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#14532d" text-anchor="start">class User(BaseModel):</text><text x="34" y="105.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">  name: str</text><text x="34" y="124.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">  age: int</text><text x="34" y="143.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">  email: Optional[str] = None</text><path d="M260 110L338 110" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="299" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Pydantic</text><rect x="340" y="50" width="200" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="440" y="86.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a" text-anchor="middle">JSON Schema</text><text x="440" y="105.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">name: string, required</text><text x="440" y="124.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">age: integer, required</text><text x="440" y="143.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">email: string or nothing</text><path d="M540 110L568 70" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M540 110L568 150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="570" y="40" width="170" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="655" y="63.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Way 1</text><text x="655" y="82.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the company enforces</text><rect x="570" y="124" width="170" height="56" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="655" y="147.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Way 2</text><text x="655" y="166.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">your code checks</text><text x="380" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Write the form once; both ways use the same description</text>
</svg>
