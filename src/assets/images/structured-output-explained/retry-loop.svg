<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t">
  <title id="t">The AI fills in the form. A checker looks at it. If it fails, the error goes back to the AI for another try. If it passes, your program gets the result.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#dc2626" />
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16a34a" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="268" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="30" y="70" width="140" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="100" y="97" text-anchor="middle" class="b">Text + form</text>
  <text x="100" y="116" text-anchor="middle" class="mut">invoice + schema</text>

  <line x1="175" y1="100" x2="225" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="230" y="70" width="110" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="285" y="97" text-anchor="middle" class="b">AI</text>
  <text x="285" y="116" text-anchor="middle" class="mut">fills in the form</text>

  <line x1="345" y1="100" x2="395" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="400" y="70" width="130" height="60" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="465" y="97" text-anchor="middle" class="b">Pydantic check</text>
  <text x="465" y="116" text-anchor="middle" class="mut">on your computer</text>

  <line x1="535" y1="100" x2="585" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#g)" />
  <text x="560" y="90" text-anchor="middle" class="mut">pass</text>

  <rect x="590" y="70" width="110" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="645" y="97" text-anchor="middle" class="b">Your program</text>
  <text x="645" y="116" text-anchor="middle" class="mut">gets an Invoice</text>

  <path d="M465 135 V195 H285 V140" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#r)" />
  <text x="375" y="215" text-anchor="middle" class="mut">fail: send the error back and ask again</text>
  <rect x="270" y="225" width="210" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5" />
  <text x="375" y="246" text-anchor="middle" class="mut">“due_date is before invoice_date”</text>

  <text x="360" y="40" text-anchor="middle" class="b">Instructor = Pydantic check + ask again (up to max_retries)</text>
</svg>
