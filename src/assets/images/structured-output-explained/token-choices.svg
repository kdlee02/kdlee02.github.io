<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t">
  <title id="t">Four pairs of bar charts, gray for no rules and blue for structured generation. First token: "Here" 35.6% without rules, blocked with rules, where only "{" 90.8% and "{\"" 9.2% remain. Field name: "name" goes from 67.3% to 99.7%. The name itself: "John" is 7.1% both ways. Job: "Software" is 74.2% without rules but blocked; "Doctor" leads the allowed jobs at 45.8%.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .x { fill: #dc2626; font-size: 12px; }
  </style>
  <rect x="1" y="1" width="718" height="448" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- legend -->
  <rect x="200" y="20" width="14" height="14" rx="2" fill="#cbd5e1" />
  <text x="220" y="32" class="mut">no rules</text>
  <rect x="300" y="20" width="14" height="14" rx="2" fill="#2563eb" />
  <text x="320" y="32" class="mut">with structured generation</text>
  <text x="360" y="54" text-anchor="middle" class="mut">longer bar = more likely to be picked next</text>

  <!-- panel 1: first token -->
  <text x="35" y="88" class="b">1. First token</text>
  <text x="35" y="106" class="mut">the form decides</text>
  <text x="45" y="135" class="mono">Here</text>
  <rect x="95" y="123" width="64" height="15" rx="2" fill="#cbd5e1" /><text x="165" y="135" class="mut">35.6%</text>
  <text x="95" y="155" class="x">blocked</text>
  <text x="45" y="185" class="mono">{</text>
  <rect x="95" y="173" width="163" height="15" rx="2" fill="#2563eb" /><text x="264" y="185" class="mut">90.8%</text>
  <text x="45" y="210" class="mono">{"</text>
  <rect x="95" y="198" width="17" height="15" rx="2" fill="#2563eb" /><text x="118" y="210" class="mut">9.2%</text>

  <!-- panel 2: field name -->
  <text x="385" y="88" class="b">2. The first label</text>
  <text x="385" y="106" class="mut">the model mostly knew</text>
  <text x="395" y="140" class="mono">name</text>
  <rect x="445" y="128" width="121" height="15" rx="2" fill="#cbd5e1" /><text x="572" y="140" class="mut">67.3%</text>
  <rect x="445" y="147" width="179" height="15" rx="2" fill="#2563eb" /><text x="630" y="159" class="mut">99.7%</text>

  <line x1="30" y1="235" x2="690" y2="235" stroke="#f1f5f9" />

  <!-- panel 3: free value -->
  <text x="35" y="268" class="b">3. The name itself</text>
  <text x="35" y="286" class="mut">rules change nothing</text>
  <text x="45" y="320" class="mono">John</text>
  <rect x="95" y="308" width="13" height="15" rx="2" fill="#cbd5e1" /><text x="114" y="320" class="mut">7.1%</text>
  <rect x="95" y="327" width="13" height="15" rx="2" fill="#2563eb" /><text x="114" y="339" class="mut">7.1%</text>

  <!-- panel 4: job literal -->
  <text x="385" y="268" class="b">4. A job from a fixed list</text>
  <text x="385" y="286" class="mut">the favorite isn't on the list</text>
  <text x="395" y="315" class="mono">Software</text>
  <rect x="465" y="303" width="134" height="15" rx="2" fill="#cbd5e1" /><text x="605" y="315" class="mut">74.2%</text>
  <text x="465" y="335" class="x">blocked</text>
  <text x="395" y="365" class="mono">Doctor</text>
  <rect x="465" y="353" width="82" height="15" rx="2" fill="#2563eb" /><text x="553" y="365" class="mut">45.8%</text>
  <text x="395" y="390" class="mono">B…</text>
  <rect x="465" y="378" width="43" height="15" rx="2" fill="#2563eb" /><text x="514" y="390" class="mut">24.1%</text>
  <text x="395" y="415" class="mono">D…</text>
  <rect x="465" y="403" width="42" height="15" rx="2" fill="#2563eb" /><text x="513" y="415" class="mut">23.5%</text>

  <text x="35" y="415" class="mut">Measured in the course notebook (SmolLM2-135M).</text>
</svg>
