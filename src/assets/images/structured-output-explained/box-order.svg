<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t">
<title id="t">The AI fills in the form from top to bottom and can see what it already wrote. In the fake-customer-post form, user_mood comes first and the AI wrote "awful". Then product and sentiment, then an internal_monologue with thoughts like "This app is really frustrating me." Only then did it write the message: "I've been having constant issues with the app crashing on my phone…" Put the thinking boxes first; after the answer, they only explain a choice already made.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="778" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">The AI fills the form top to bottom, and sees what it already wrote</text><path d="M184 52V212" stroke="#94a3b8" stroke-width="1.5" fill="none"/><text x="20" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">thinking first</text><text x="20" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">then the answer</text><rect x="200" y="52" width="520" height="40" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="214" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1a24b8" text-anchor="start">user_mood: "awful"</text><rect x="200" y="102" width="520" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="214" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">product: …   sentiment: …</text><rect x="200" y="152" width="520" height="60" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="214" y="177.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1a24b8" text-anchor="start">internal_monologue:</text><text x="214" y="196.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">  ["This app is really frustrating me.", …]</text><rect x="200" y="238" width="520" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="214" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">message: "I've been having constant issues with the app crashing…"</text><path d="M748 56L748 282" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="748" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">order</text>
