<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t">
<title id="t">Correct shape isn't correct answer. An answer like Person(name='John', age=30) passes the question "does it fit the form?", which all three ways make sure of. It fails "is it true?", which none of them check: it is perfect JSON that describes nobody. You still have to check the facts yourself, with code or a person.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="218" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="70" width="240" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="140" y="105.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#0f172a" text-anchor="middle">The answer</text><text x="140" y="124.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">Person(name='John', age=30)</text><path d="M260 110L298 70" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M260 110L298 160" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="300" y="40" width="210" height="60" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="405" y="65.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Fits the form?</text><text x="405" y="84.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">✓ all three ways check</text><rect x="300" y="130" width="210" height="60" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="405" y="155.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">Is it true?</text><text x="405" y="174.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">✗ none of them check</text><path d="M510 160L538 160" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="540" y="130" width="200" height="60" rx="10" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/><text x="640" y="155.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7c2d12" text-anchor="middle">You check the facts</text><text x="640" y="174.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">with code or a person</text><text x="540" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">perfect JSON that</text><text x="540" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">describes nobody</text>
</svg>
