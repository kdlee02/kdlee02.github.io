<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t">
  <title id="t">A state machine for the pattern A*B*C* with four squares: start, A, B and C. From start or A you can read A, B or C; from B only B or C; from C only C. The text AABC is traced to the end and matches. The text ACA gets stuck on square C, which has no arrow for A.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .lbl { font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #2563eb; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="368" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <text x="360" y="28" text-anchor="middle" class="b">Pattern A*B*C*: some A's, then some B's, then some C's</text>

  <!-- self loops -->
  <g fill="none" stroke="#64748b" stroke-width="2">
    <path d="M238 102 C215 50 285 50 262 102" marker-end="url(#a)" />
    <path d="M408 102 C385 50 455 50 432 102" marker-end="url(#a)" />
    <path d="M578 102 C555 50 625 50 602 102" marker-end="url(#a)" />
  </g>
  <text x="250" y="58" text-anchor="middle" class="lbl">A</text>
  <text x="420" y="58" text-anchor="middle" class="lbl">B</text>
  <text x="590" y="58" text-anchor="middle" class="lbl">C</text>

  <!-- straight arrows -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="110" y1="130" x2="218" y2="130" marker-end="url(#a)" />
    <line x1="280" y1="130" x2="388" y2="130" marker-end="url(#a)" />
    <line x1="450" y1="130" x2="558" y2="130" marker-end="url(#a)" />
  </g>
  <text x="164" y="122" text-anchor="middle" class="lbl">A</text>
  <text x="334" y="122" text-anchor="middle" class="lbl">B</text>
  <text x="504" y="122" text-anchor="middle" class="lbl">C</text>

  <!-- skip arcs -->
  <g fill="none" stroke="#94a3b8" stroke-width="1.6">
    <path d="M92 156 Q250 225 404 158" marker-end="url(#a)" />
    <path d="M86 158 Q335 280 576 158" marker-end="url(#a)" />
    <path d="M262 156 Q420 230 576 158" marker-end="url(#a)" />
  </g>
  <text x="250" y="205" text-anchor="middle" class="lbl">B</text>
  <text x="335" y="234" text-anchor="middle" class="lbl">C</text>
  <text x="440" y="208" text-anchor="middle" class="lbl">C</text>

  <!-- states (all are goal squares: double ring) -->
  <g fill="#f8fafc" stroke="#1e293b" stroke-width="1.5">
    <circle cx="80" cy="130" r="28" /><circle cx="80" cy="130" r="23" />
    <circle cx="250" cy="130" r="28" /><circle cx="250" cy="130" r="23" />
    <circle cx="420" cy="130" r="28" /><circle cx="420" cy="130" r="23" />
    <circle cx="590" cy="130" r="28" /><circle cx="590" cy="130" r="23" />
  </g>
  <text x="80" y="135" text-anchor="middle" class="b">start</text>
  <text x="250" y="135" text-anchor="middle" class="b">A</text>
  <text x="420" y="135" text-anchor="middle" class="b">B</text>
  <text x="590" y="135" text-anchor="middle" class="b">C</text>
  <text x="690" y="250" text-anchor="end" class="mut">double ring = goal square</text>

  <!-- traces -->
  <rect x="40" y="268" width="640" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="56" y="290"><tspan class="b">AABC</tspan>   start → A → A → B → C   ends on a goal square: <tspan class="b" style="fill:#16a34a">matches</tspan></text>
  <rect x="40" y="312" width="640" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" />
  <text x="56" y="334"><tspan class="b">ACA</tspan>   start → A → C → ?   no arrow labeled A leaves C: <tspan class="b" style="fill:#dc2626">stuck</tspan></text>
</svg>
