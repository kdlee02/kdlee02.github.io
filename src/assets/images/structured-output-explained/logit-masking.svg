<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t">
  <title id="t">On the left, the model's choices for the first token: hamburger, ham, hot dog, hot, not, H. On the right, after structured generation, hamburger and ham are crossed out and the chances of the allowed tokens are scaled up to fill the space.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <text x="360" y="30" text-anchor="middle" class="b">Answer only “hot dog” or “not hot dog” (picture of a hamburger)</text>

  <!-- left: before -->
  <text x="40" y="62" class="b">What the model wants</text>
  <g>
    <text x="40" y="92" class="mono">hamburger</text><rect x="120" y="80" width="150" height="16" rx="2" fill="#cbd5e1" />
    <text x="40" y="122" class="mono">ham</text><rect x="120" y="110" width="60" height="16" rx="2" fill="#cbd5e1" />
    <text x="40" y="152" class="mono">hot dog</text><rect x="120" y="140" width="40" height="16" rx="2" fill="#cbd5e1" />
    <text x="40" y="182" class="mono">hot</text><rect x="120" y="170" width="30" height="16" rx="2" fill="#cbd5e1" />
    <text x="40" y="212" class="mono">not</text><rect x="120" y="200" width="30" height="16" rx="2" fill="#cbd5e1" />
    <text x="40" y="242" class="mono">H</text><rect x="120" y="230" width="20" height="16" rx="2" fill="#cbd5e1" />
  </g>

  <line x1="300" y1="160" x2="370" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="335" y="148" text-anchor="middle" class="mut">cross out</text>
  <text x="335" y="180" text-anchor="middle" class="mut">rescale</text>

  <!-- right: after -->
  <text x="400" y="62" class="b">What the sampler can pick</text>
  <g>
    <text x="400" y="92" class="mono" style="fill:#94a3b8">hamburger</text>
    <line x1="398" y1="88" x2="470" y2="88" stroke="#dc2626" stroke-width="2" />
    <text x="485" y="92" class="mut" style="fill:#dc2626">blocked</text>
    <text x="400" y="122" class="mono" style="fill:#94a3b8">ham</text>
    <line x1="398" y1="118" x2="426" y2="118" stroke="#dc2626" stroke-width="2" />
    <text x="485" y="122" class="mut" style="fill:#dc2626">blocked</text>
    <text x="400" y="152" class="mono">hot dog</text><rect x="480" y="140" width="80" height="16" rx="2" fill="#2563eb" />
    <text x="400" y="182" class="mono">hot</text><rect x="480" y="170" width="60" height="16" rx="2" fill="#2563eb" />
    <text x="400" y="212" class="mono">not</text><rect x="480" y="200" width="60" height="16" rx="2" fill="#2563eb" />
    <text x="400" y="242" class="mono">H</text><rect x="480" y="230" width="40" height="16" rx="2" fill="#2563eb" />
    <text x="530" y="242" class="mut">can still become “hot dog”</text>
  </g>

  <text x="360" y="282" text-anchor="middle" class="mut">Illustration of the course's example; bar lengths are not measured values.</text>
</svg>
