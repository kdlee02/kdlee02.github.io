, monospace" font-size="15" font-weight="400" fill="#1a24b8" text-anchor="middle">1234</text><text x="20" y="151" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="start">Tic-tac-toe, top row</text><rect x="200" y="126" width="37" height="40" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="218.5" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1a24b8" text-anchor="middle">X</text><rect x="243" y="126" width="37" height="40" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="261.5" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#14532d" text-anchor="middle">|</text><rect x="286" y="126" width="37" height="40" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="304.5" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1a24b8" text-anchor="middle">O</text><rect x="329" y="126" width="37" height="40" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="347.5" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#14532d" text-anchor="middle">|</text><rect x="372" y="126" width="37" height="40" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="390.5" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1a24b8" text-anchor="middle">O</text><rect x="200" y="200" width="16" height="16" rx="3" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="224" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">fixed by the pattern</text><re