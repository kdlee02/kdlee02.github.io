<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="t">
<title id="t">The pattern does the layout, the model makes the choices. In the phone number (206) 555-1234, the brackets, space and dash are fixed by the pattern and the digits are chosen by the model. On the tic-tac-toe board's top row, X|O|O, the bars are fixed by the pattern and the model only picks X, O or blank in each spot, so it cannot draw a broken board.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="238" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
