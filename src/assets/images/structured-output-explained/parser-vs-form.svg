<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t">
  <title id="t">Top: free text goes through a fragile hand-written parser that has to guess both whether it's a complaint and what the reply is. Bottom: the AI fills a form with a complaint box and a response box, and a simple if-statement routes it.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- top row: parser -->
  <text x="30" y="34" class="b">With free text</text>
  <rect x="30" y="50" width="70" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="65" y="83" text-anchor="middle" class="b">AI</text>
  <line x1="104" y1="78" x2="134" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="138" y="50" width="190" height="56" rx="14" fill="#fef3c7" stroke="#d97706" />
  <text x="150" y="73">“So sorry the site is down!</text>
  <text x="150" y="92">We're on it…”</text>
  <line x1="332" y1="78" x2="362" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="366" y="44" width="200" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 4" />
  <text x="466" y="66" text-anchor="middle" class="b">Hand-written parser</text>
  <text x="466" y="84" text-anchor="middle" class="mut">guess: is it a complaint?</text>
  <text x="466" y="100" text-anchor="middle" class="mut">guess: where's the reply?</text>
  <line x1="570" y1="78" x2="600" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="650" y="76" text-anchor="middle" class="b" style="fill:#dc2626">???</text>
  <text x="650" y="94" text-anchor="middle" class="mut">breaks often</text>

  <line x1="30" y1="140" x2="690" y2="140" stroke="#e2e8f0" />

  <!-- bottom row: form -->
  <text x="30" y="172" class="b">With a form</text>
  <rect x="30" y="200" width="70" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="65" y="233" text-anchor="middle" class="b">AI</text>
  <line x1="104" y1="228" x2="134" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="138" y="188" width="230" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="150" y="214" class="mono">complaint</text>
  <rect x="235" y="199" width="120" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" />
  <text x="245" y="214" class="mono">true</text>
  <text x="150" y="248" class="mono">response</text>
  <rect x="235" y="233" width="120" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" />
  <text x="245" y="248" class="mono">"So sorry…"</text>
  <line x1="372" y1="228" x2="402" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="406" y="204" width="120" height="48" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="466" y="233" text-anchor="middle" class="mono">if complaint:</text>
  <path d="M530 218 L568 196" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <path d="M530 238 L568 262" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <rect x="572" y="176" width="118" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="631" y="199" text-anchor="middle">Customer support</text>
  <rect x="572" y="248" width="118" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="631" y="271" text-anchor="middle">Post the reply</text>
  <text x="549" y="196" text-anchor="end" class="mut">yes</text>
  <text x="549" y="276" text-anchor="end" class="mut">no</text>

  <text x="360" y="312" text-anchor="middle" class="mut">A new feature is one if-statement, not another set of parsing rules.</text>
</svg>
