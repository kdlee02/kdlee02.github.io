<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t">
  <title id="t">Time and cost for each step of the research agent in the course's example. Time: search terms 7 seconds, web search 5, picking sources 3, fetching pages 11, writing the essay 18, about 44 seconds in total. Cost: search terms 0.0004 dollars, web search 0.016, picking sources 0.0004, fetching pages 0.002 plus 0.03 for PDF to text, writing the essay 0.009, about 6 cents in total.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
  </style>
  <rect x="1" y="1" width="778" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <text x="320" y="44" text-anchor="middle" class="b">Time per step (seconds)</text>
  <text x="620" y="44" text-anchor="middle" class="b">Cost per step (one run)</text>
  <line x1="485" y1="30" x2="485" y2="290" stroke="#e2e8f0" stroke-width="2" />

  <g text-anchor="end">
    <text x="190" y="81">AI: search terms</text>
    <text x="190" y="125">Web search</text>
    <text x="190" y="169">AI: pick sources</text>
    <text x="190" y="213">Fetch pages</text>
    <text x="190" y="257">AI: write essay</text>
  </g>

  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="200" y="68" width="85" height="16" rx="3" />
    <rect x="200" y="112" width="61" height="16" rx="3" />
    <rect x="200" y="156" width="37" height="16" rx="3" />
    <rect x="200" y="200" width="134" height="16" rx="3" />
    <rect x="200" y="244" width="220" height="16" rx="3" />
  </g>
  <g class="b">
    <text x="293" y="81">7</text><text x="269" y="125">5</text><text x="245" y="169">3</text>
    <text x="342" y="213">11</text><text x="428" y="257">18</text>
  </g>

  <g fill="#fef3c7" stroke="#d97706">
    <rect x="500" y="68" width="3" height="16" />
    <rect x="500" y="112" width="100" height="16" rx="3" />
    <rect x="500" y="156" width="3" height="16" />
    <rect x="500" y="200" width="13" height="16" rx="2" />
    <rect x="500" y="244" width="56" height="16" rx="3" />
  </g>
  <rect x="513" y="200" width="187" height="16" rx="3" fill="#fdba74" stroke="#c2410c" />
  <g class="b">
    <text x="511" y="81">$0.0004</text><text x="608" y="125">$0.016</text><text x="511" y="169">$0.0004</text>
    <text x="708" y="213">$0.032</text><text x="564" y="257">$0.009</text>
  </g>
  <text x="500" y="233" class="mut">fetch $0.002 + PDF-to-text $0.03</text>

  <text x="320" y="292" text-anchor="middle" class="mut">Total ≈ 44 seconds</text>
  <text x="620" y="292" text-anchor="middle" class="mut">Total ≈ $0.058</text>
  <text x="390" y="318" text-anchor="middle" class="mut">Numbers from the course’s example. AI steps are charged per token, the others per call.</text>
</svg>
