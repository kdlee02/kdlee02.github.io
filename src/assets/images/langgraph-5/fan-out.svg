<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t">
<title id="t">Fan-out and fan-in. START has edges to search_menu, search_web and search_wiki, so all three run in the same step; their edges meet at filter_documents, which waits for all three. The three searches write to one field, search_results, which needs the add reducer: without it, my run raised InvalidUpdateError. filter_documents writes its keepers to a separate field, documents, because writing back into the add field would append them on top of the raw results.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="378" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="56" cy="130" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="56" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a" text-anchor="middle">START</text><path d="M86 130L176 56" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="178" y="30" width="150" height="52" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="253" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">search_menu</text><path d="M328 56L430 130" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M86 130L176 130" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="178" y="104" width="150" height="52" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="253" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">search_web</text><path d="M328 130L430 130" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M86 130L176 204" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="178" y="178" width="150" height="52" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="253" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">search_wiki</text><path d="M328 204L430 130" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="130" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">fan-out: all three</text><text x="130" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">run in the same step</text><rect x="432" y="98" width="150" height="64" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="507" y="125.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">filter_documents</text><text x="507" y="144.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">waits for all three</text><text x="507" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">fan-in</text><path d="M582 130L624 130" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><circle cx="656" cy="130" r="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="656" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a" text-anchor="middle">END</text><rect x="232" y="296" width="250" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="357" y="323.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">search_results: Annotated[list, add]</tspan></text><text x="357" y="342.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">the three searches add here</text><rect x="498" y="296" width="242" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="619" y="323.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">documents: list</tspan></text><text x="619" y="342.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">the filter writes keepers here</text><text x="357" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7f1d1d" text-anchor="middle">no reducer: InvalidUpdateError</text><text x="619" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">own field: no duplicates</text>
</svg>
