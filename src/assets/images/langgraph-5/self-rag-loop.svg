<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t">
  <title id="t">The Self-RAG graph. START, retrieve, then grade_documents keeps only relevant documents. If none are left, transform_query rewrites the question and the graph retrieves again; otherwise generate writes an answer. grade_generation then checks it. Not supported by the documents: generate again. Supported but not answering the question: transform_query and search again. Useful: END. A counter, num_generations, stops the loops after a few tries.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 11.5px; }
    .b { font-weight: 700; }
    .node { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; }
    .cond { fill: #b45309; font-size: 11.5px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="378" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- main row -->
  <rect x="16" y="150" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="47" y="174" text-anchor="middle" class="b">START</text>
  <rect x="100" y="148" width="104" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="152" y="174" text-anchor="middle" class="node">retrieve</text>
  <rect x="232" y="148" width="150" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="307" y="168" text-anchor="middle" class="node">grade_documents</text>
  <text x="307" y="184" text-anchor="middle" class="mut">keep relevant docs</text>
  <rect x="440" y="148" width="110" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="495" y="174" text-anchor="middle" class="node">generate</text>
  <rect x="590" y="140" width="170" height="60" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="675" y="164" text-anchor="middle" class="node">grade_generation</text>
  <text x="675" y="182" text-anchor="middle" class="mut">grounded? answers it?</text>

  <rect x="644" y="300" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="675" y="324" text-anchor="middle" class="b">END</text>

  <rect x="200" y="290" width="150" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="275" y="310" text-anchor="middle" class="node">transform_query</text>
  <text x="275" y="326" text-anchor="middle" class="mut">reword the question</text>

  <line x1="78" y1="170" x2="96" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="204" y1="170" x2="228" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="382" y1="170" x2="436" y2="170" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="409" y="140" text-anchor="middle" class="cond">some kept</text>
  <line x1="550" y1="170" x2="586" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <!-- none kept -> transform_query -->
  <path d="M307 192 V286" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="315" y="246" class="cond">none kept</text>
  <!-- transform_query -> retrieve -->
  <path d="M200 312 H152 V196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="70" y="262" class="mut">search again</text>

  <!-- useful -> END -->
  <line x1="675" y1="200" x2="675" y2="296" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="684" y="256" class="cond">useful</text>
  <!-- not useful -> transform_query -->
  <path d="M620 200 C 600 250, 420 312, 354 312" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="572" y="236" text-anchor="end" class="cond">not useful: doesn't answer it</text>
  <!-- not supported -> generate -->
  <path d="M640 140 C 620 80, 520 80, 500 144" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="570" y="70" text-anchor="middle" class="cond">not supported: not in the documents, write it again</text>

  <text x="390" y="364" text-anchor="middle" class="mut">num_generations counts rewrites and answers; after a few tries the graph stops looping.</text>
</svg>
