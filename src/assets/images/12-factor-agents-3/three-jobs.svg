<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t">
<title id="t">The agent split into three small methods. run() loops until the task is done or the step limit is hit. Each time, it calls _next_step(), which does one step on the state and hands back a new state. _next_step() calls _call_model(), the only method that talks to the model. Tool descriptions live in their own tools/*.json files, so they can be reworded without touching Python.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="288" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Three small methods, each with one job</text><rect x="20" y="100" width="190" height="80" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="115" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">run()</text><text x="115" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">loops until done</text><text x="115" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">or the step limit</text><path d="M210 140L248 140" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M330 100Q230 46 130 98" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="230" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">new state</text><rect x="250" y="100" width="190" height="80" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="345" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">_next_step()</text><text x="345" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">does one step</text><text x="345" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">on the state</text><path d="M440 140L478 140" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="480" y="100" width="140" height="80" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="550" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">_call_model()</text><text x="550" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">talks to</text><text x="550" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the model</text><path d="M620 140L648 140" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="650" y="110" width="90" height="60" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="695" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model</text><rect x="480" y="220" width="140" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="550" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">tools/*.json</text><path d="M550 220L550 182" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="468" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">tool descriptions, editable without touching Python</text>
</svg>
