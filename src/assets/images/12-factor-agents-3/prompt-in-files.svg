<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t">
<title id="t">Before, the system prompt was a string inside agent.py. After, the prompt lives in prompts/base_system.md and the tool descriptions in tools/*.json, and agent.py reads them. Prompt edits now show up in code review, can be compared and can be undone.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="268" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="185" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Before</text><text x="575" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">After</text><rect x="20" y="56" width="330" height="164" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="40" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">agent.py</tspan></text><text x="40" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">system_prompt = """</text><text x="40" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">  You are an autonomous agent…</text><text x="40" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">  ALWAYS prefer calling tools…</text><text x="40" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">"""</text><text x="185" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">the prompt is a string buried in the code</text><rect x="410" y="56" width="330" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="575" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">prompts/base_system.md</text><rect x="410" y="108" width="330" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="575" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">tools/*.json</text><path d="M575 152L575 174" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="410" y="176" width="330" height="44" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="575" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14532d" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">agent.py</tspan> reads them</text><text x="575" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">edits show up in review, diffs and undo</text>
</svg>
