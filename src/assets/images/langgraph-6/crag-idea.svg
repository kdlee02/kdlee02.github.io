<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t">
<title id="t">How CRAG treats search results. The paper sorts them three ways: correct results are refined to the useful pieces, incorrect ones are replaced by a web search, and ambiguous ones get both. The course keeps it simpler: keep or drop each result, refine what is kept, and search the web only if nothing useful is left.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="288" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">The paper: three verdicts</text><rect x="30" y="56" width="130" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Search results</text><path d="M160 84L194 84" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M196 84L256 46L316 84L256 122Z" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/><text x="256" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">grade</text><path d="M316 84L340 84L340 52L446 52" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="352" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">correct</text><rect x="448" y="32" width="292" height="40" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="594" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">refine to the useful pieces</text><path d="M316 84L340 84L340 106L446 106" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="352" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">ambiguous</text><rect x="448" y="86" width="292" height="40" rx="10" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/><text x="594" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">refine and search the web</text><path d="M316 84L340 84L340 160L446 160" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="352" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">incorrect</text><rect x="448" y="140" width="292" height="40" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="594" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle">replace with a web search</text><path d="M30 196H740" stroke="#e2e8f0"/><text x="30" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">The course: keep or drop</text><rect x="30" y="238" width="130" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a" text-anchor="middle">Search results</text><path d="M160 258L194 258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="196" y="238" width="150" height="40" rx="10" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/><text x="271" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">keep or drop each</text><path d="M346 258L380 258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="382" y="238" width="150" height="40" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="457" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">refine what's kept</text><path d="M532 258L566 258" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="568" y="238" width="172" height="40" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="654" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle">nothing left? the web</text>
</svg>
