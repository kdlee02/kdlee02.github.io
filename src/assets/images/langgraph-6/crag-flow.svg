<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t">
  <title id="t">The Corrective RAG graph. START, retrieve searches the menu, grade_documents keeps the relevant documents, and refine_knowledge splits them into strips, scores each from 0 to 1 and keeps those above 0.5. decide_to_generate then branches. If strips are left, generate answers from them. If none are left, transform_query rewrites the question for the web, web_search adds web results, and generate answers from those. Then END.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 11.5px; }
    .b { font-weight: 700; }
    .node { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; }
    .cond { fill: #b45309; font-size: 11.5px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="16" y="70" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="47" y="94" text-anchor="middle" class="b">START</text>
  <rect x="100" y="66" width="120" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="160" y="87" text-anchor="middle" class="node">retrieve</text>
  <text x="160" y="104" text-anchor="middle" class="mut">search the menu</text>
  <rect x="250" y="66" width="150" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="325" y="87" text-anchor="middle" class="node">grade_documents</text>
  <text x="325" y="104" text-anchor="middle" class="mut">keep relevant docs</text>
  <rect x="430" y="66" width="160" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="510" y="87" text-anchor="middle" class="node">refine_knowledge</text>
  <text x="510" y="104" text-anchor="middle" class="mut">strips scoring &gt; 0.5</text>
  <rect x="620" y="62" width="144" height="56" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="692" y="86" text-anchor="middle" class="node">decide_to_</text>
  <text x="692" y="102" text-anchor="middle" class="node">generate</text>

  <line x1="78" y1="90" x2="96" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="220" y1="90" x2="246" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="400" y1="90" x2="426" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="590" y1="90" x2="616" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <!-- no strips path -->
  <rect x="380" y="200" width="150" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="455" y="221" text-anchor="middle" class="node">transform_query</text>
  <text x="455" y="238" text-anchor="middle" class="mut">reword for the web</text>
  <rect x="190" y="200" width="150" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" />
  <text x="265" y="221" text-anchor="middle" class="node">web_search</text>
  <text x="265" y="238" text-anchor="middle" class="mut">add web results</text>

  <rect x="610" y="200" width="110" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="665" y="229" text-anchor="middle" class="node">generate</text>
  <rect x="634" y="276" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="665" y="300" text-anchor="middle" class="b">END</text>

  <!-- strips left -> generate -->
  <line x1="680" y1="118" x2="672" y2="196" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="692" y="164" class="cond">strips left</text>
  <!-- none -> transform_query -->
  <path d="M640 118 C 600 170, 560 224, 534 224" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="560" y="150" text-anchor="end" class="cond">no strips left</text>
  <line x1="380" y1="224" x2="344" y2="224" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <!-- web_search -> generate -->
  <path d="M265 248 V290 H560 C 600 290, 620 270, 630 252" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="665" y1="248" x2="665" y2="272" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
</svg>
