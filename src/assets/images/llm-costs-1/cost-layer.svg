<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="t">
  <title id="t">The cost layer as a flow. A call site sends a prompt and model to generate(). generate() looks up the model's rates with price_for(), which reads the PRICING table and fails clearly for an unknown model. It calls the provider, extracts the usage fields, and passes plain token counts to calculate_cost(), a pure function with no API access. The result is a Completion record with the text, model, token counts and cost. Each Completion is appended to a spend.jsonl log, and a report reads the log back to compute the total spend, spend per model and the most expensive call.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; }
    .bug { fill: #b91c1c; font-size: 12.5px; }
    .bugh { fill: #b91c1c; font-size: 12.5px; font-weight: 700; }
    .ln { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="818" height="398" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="20" y="70" width="120" height="60" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="80" y="96" text-anchor="middle" class="h">Call site</text>
  <text x="80" y="115" text-anchor="middle" class="mut">prompt, model</text>
  <line x1="140" y1="100" x2="168" y2="100" class="ln" marker-end="url(#a)" />

  <rect x="170" y="40" width="210" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="275" y="64" text-anchor="middle" class="mono" font-weight="700">generate()</text>
  <text x="186" y="88">1. look up rates first</text>
  <text x="186" y="108">2. call the provider</text>
  <text x="186" y="128">3. read its usage fields</text>
  <text x="186" y="148">4. return a Completion</text>
  <line x1="380" y1="100" x2="418" y2="100" class="ln" marker-end="url(#a)" />

  <rect x="420" y="40" width="160" height="120" rx="8" fill="#ffffff" stroke="#64748b" />
  <text x="500" y="64" text-anchor="middle" class="mono" font-weight="700">Completion</text>
  <text x="436" y="88" class="mono">text, model</text>
  <text x="436" y="106" class="mono">token counts</text>
  <text x="436" y="124" class="mono">reasoning (info)</text>
  <text x="436" y="142" class="mono">cost</text>
  <line x1="580" y1="100" x2="618" y2="100" class="ln" marker-end="url(#a)" />

  <rect x="620" y="60" width="180" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="710" y="90" text-anchor="middle" class="mono" font-weight="700">spend.jsonl</text>
  <text x="710" y="110" text-anchor="middle" class="mut">one JSON line per call,</text>
  <text x="710" y="126" text-anchor="middle" class="mut">appended, never rewritten</text>

  <!-- below generate -->
  <line x1="215" y1="196" x2="215" y2="162" class="ln" marker-end="url(#a)" />
  <text x="223" y="184" class="mut">rates</text>
  <rect x="120" y="198" width="190" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="215" y="222" text-anchor="middle" class="mono" font-weight="700">PRICING + price_for()</text>
  <text x="215" y="242" text-anchor="middle" class="mut">one table, rates per token</text>
  <text x="215" y="260" text-anchor="middle" class="mut">unknown model → KeyError</text>

  <line x1="330" y1="162" x2="372" y2="196" class="ln" marker-end="url(#a)" />
  <line x1="388" y1="196" x2="350" y2="162" class="ln" marker-end="url(#a)" />
  <rect x="330" y="198" width="190" height="78" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="425" y="222" text-anchor="middle" class="mono" font-weight="700">calculate_cost()</text>
  <text x="425" y="242" text-anchor="middle" class="mut">pure: token counts in,</text>
  <text x="425" y="260" text-anchor="middle" class="mut">dollars out, no API</text>

  <line x1="710" y1="140" x2="710" y2="196" class="ln" marker-end="url(#a)" />
  <rect x="620" y="198" width="180" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7" />
  <text x="710" y="222" text-anchor="middle" class="h">Baseline report</text>
  <text x="710" y="244" text-anchor="middle">total spend</text>
  <text x="710" y="264" text-anchor="middle">spend per model</text>
  <text x="710" y="284" text-anchor="middle">most expensive call</text>

  <text x="410" y="336" text-anchor="middle" class="mut">Provider details stay in generate(); billing math stays in calculate_cost().</text>
  <text x="410" y="356" text-anchor="middle" class="mut">Every later optimization is measured against the baseline report.</text>
</svg>
