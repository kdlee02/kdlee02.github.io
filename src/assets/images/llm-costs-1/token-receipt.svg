<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t">
  <title id="t">One request's bill, drawn as a receipt. The input total splits into three line items: fresh input at $1.00 per million tokens, cache writes at $1.25 and cached input at $0.10. The output total is one line item at $6.00 per million, and reasoning tokens are drawn inside the output box because they are already part of the output count. The total is the sum of the four line items. Two common bugs are marked: charging all input at the fresh rate, and adding reasoning tokens on top of output.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; }
    .bug { fill: #b91c1c; font-size: 12.5px; }
    .bugh { fill: #b91c1c; font-size: 12.5px; font-weight: 700; }
    .ln { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="818" height="468" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- receipt -->
  <rect x="30" y="20" width="430" height="430" rx="10" fill="#f8fafc" stroke="#94a3b8" />
  <text x="245" y="48" text-anchor="middle" class="h">One request, gpt-5.6-luna</text>
  <text x="245" y="66" text-anchor="middle" class="mut">prices per million tokens, checked Aug 11, 2026</text>

  <rect x="48" y="82" width="394" height="142" rx="8" fill="#e0f2fe" stroke="#0284c7" />
  <text x="62" y="104" class="h">Input</text>
  <text x="428" y="104" text-anchor="end" class="mono">usage.input_tokens</text>
  <rect x="62" y="116" width="366" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" />
  <text x="74" y="136">Fresh input</text>
  <text x="414" y="136" text-anchor="end" class="mono">$1.00</text>
  <rect x="62" y="152" width="366" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" />
  <text x="74" y="172">Cache write</text>
  <text x="414" y="172" text-anchor="end" class="mono">$1.25</text>
  <rect x="62" y="188" width="366" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" />
  <text x="74" y="208">Cached input</text>
  <text x="414" y="208" text-anchor="end" class="mono">$0.10</text>

  <rect x="48" y="238" width="394" height="122" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="62" y="260" class="h">Output</text>
  <text x="428" y="260" text-anchor="end" class="mono">usage.output_tokens</text>
  <rect x="62" y="272" width="366" height="76" rx="5" fill="#ffffff" stroke="#cbd5e1" />
  <text x="74" y="292">Visible answer + reasoning</text>
  <text x="414" y="292" text-anchor="end" class="mono">$6.00</text>
  <rect x="80" y="304" width="250" height="34" rx="5" fill="#fffbeb" stroke="#d97706" stroke-dasharray="4 3" />
  <text x="92" y="326" class="mono">reasoning_tokens</text>
  <text x="226" y="326" class="mut">already inside</text>

  <line x1="48" y1="380" x2="442" y2="380" stroke="#94a3b8" stroke-dasharray="3 3" />
  <text x="62" y="404" class="h">Total</text>
  <text x="428" y="404" text-anchor="end" class="mono">sum of the four line items</text>
  <text x="62" y="430" class="mut">total_tokens is shown for convenience, never priced</text>

  <!-- bugs -->
  <text x="490" y="120" class="bugh">Bug 1: one rate for all input</text>
  <text x="490" y="140" class="bug">Charging input_tokens at $1.00</text>
  <text x="490" y="158" class="bug">hides every caching saving.</text>
  <line x1="486" y1="150" x2="446" y2="150" stroke="#dc2626" stroke-width="1.6" marker-end="url(#r)" />

  <text x="490" y="300" class="bugh">Bug 2: reasoning added twice</text>
  <text x="490" y="320" class="bug">output + reasoning charges the</text>
  <text x="490" y="338" class="bug">thinking tokens a second time.</text>
  <line x1="486" y1="321" x2="334" y2="321" stroke="#dc2626" stroke-width="1.6" marker-end="url(#r)" />

  <text x="490" y="210" class="h">Output costs 6× input</text>
  <text x="490" y="230" class="mut">One generated token costs as much</text>
  <text x="490" y="247" class="mut">as six tokens you send.</text>
</svg>
