<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="t">
  <title id="t">A customer asks whether any round sunglasses under 100 dollars are in stock. The AI planner sees six tools and writes a three-step plan: find round sunglasses with get_item_descriptions, check which are in stock with check_inventory, and check which are under 100 dollars with get_item_price. Your code then runs the steps in order, feeding each result into the next.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #166534; }
    .monob { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="288" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="186" y="14" width="516" height="94" rx="10" fill="none" stroke="#64748b" stroke-dasharray="5 4" />
  <text x="444" y="34" text-anchor="middle" class="b">Tools</text>
  <g fill="#dcfce7" stroke="#16a34a">
    <rect x="196" y="44" width="160" height="24" rx="6" /><rect x="364" y="44" width="160" height="24" rx="6" /><rect x="532" y="44" width="160" height="24" rx="6" />
    <rect x="196" y="76" width="160" height="24" rx="6" /><rect x="364" y="76" width="160" height="24" rx="6" /><rect x="532" y="76" width="160" height="24" rx="6" />
  </g>
  <g class="mono" text-anchor="middle">
    <text x="276" y="60">get_item_descriptions</text><text x="444" y="60">check_inventory</text><text x="612" y="60">get_item_price</text>
    <text x="276" y="92">check_past_transactions</text><text x="444" y="92">process_item_return</text><text x="612" y="92">process_item_sale</text>
  </g>
  <line x1="275" y1="108" x2="275" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2" />

  <rect x="20" y="130" width="170" height="70" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="105" y="152" text-anchor="middle" class="b">Customer</text>
  <text x="105" y="171" text-anchor="middle" class="mut">“Any round sunglasses</text>
  <text x="105" y="188" text-anchor="middle" class="mut">in stock under $100?”</text>
  <line x1="192" y1="165" x2="215" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="220" y="130" width="110" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="275" y="160" text-anchor="middle" class="b">AI planner</text>
  <text x="275" y="178" text-anchor="middle" class="mut">writes the steps</text>
  <line x1="332" y1="165" x2="355" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="360" y="124" width="400" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" />
  <text x="378" y="146" class="b">The plan</text>
  <text x="378" y="170"><tspan style="fill:#b91c1c" class="b">1.</tspan> <tspan class="monob" style="fill:#b91c1c">get_item_descriptions</tspan>: find round sunglasses</text>
  <text x="378" y="194"><tspan style="fill:#1d4ed8" class="b">2.</tspan> <tspan class="monob" style="fill:#1d4ed8">check_inventory</tspan>: which are in stock?</text>
  <text x="378" y="218"><tspan style="fill:#c2410c" class="b">3.</tspan> <tspan class="monob" style="fill:#c2410c">get_item_price</tspan>: which are under $100?</text>

  <text x="390" y="266" text-anchor="middle" class="mut">Your code then runs step 1, feeds its result into step 2, and so on. Nobody wrote this order in advance.</text>
</svg>
