<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t">
  <title id="t">Four ways agents can talk to each other. Linear: each agent passes its work to the next, very common. Manager: one manager hands out work and collects results, very common. Deeper hierarchy: some agents manage their own small teams, less common and more complex. All-to-all: any agent can message any other, rare and hard to predict.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .s { font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="268" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <g stroke="#e2e8f0" stroke-width="2">
    <line x1="200" y1="20" x2="200" y2="250" /><line x1="400" y1="20" x2="400" y2="250" /><line x1="600" y1="20" x2="600" y2="250" />
  </g>

  <text x="100" y="36" text-anchor="middle" class="b">Linear</text>
  <g fill="#ede9fe" stroke="#7c3aed">
    <rect x="55" y="56" width="90" height="26" rx="6" /><rect x="55" y="106" width="90" height="26" rx="6" /><rect x="55" y="156" width="90" height="26" rx="6" />
  </g>
  <g class="s" text-anchor="middle"><text x="100" y="73">research</text><text x="100" y="123">design</text><text x="100" y="173">write</text></g>
  <g stroke="#64748b" stroke-width="1.5"><line x1="100" y1="83" x2="100" y2="103" marker-end="url(#a)" /><line x1="100" y1="133" x2="100" y2="153" marker-end="url(#a)" /></g>
  <text x="100" y="218" text-anchor="middle" class="mut">pass the work along</text>
  <text x="100" y="236" text-anchor="middle" class="mut" style="fill:#15803d">very common</text>

  <text x="300" y="36" text-anchor="middle" class="b">Manager</text>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="300" y1="84" x2="243" y2="146" />
    <line x1="300" y1="84" x2="300" y2="146" />
    <line x1="300" y1="84" x2="357" y2="146" />
  </g>
  <g fill="#ede9fe" stroke="#7c3aed">
    <rect x="255" y="56" width="90" height="26" rx="6" />
    <rect x="212" y="150" width="58" height="26" rx="6" /><rect x="271" y="150" width="58" height="26" rx="6" /><rect x="330" y="150" width="58" height="26" rx="6" />
  </g>
  <g class="s" text-anchor="middle"><text x="300" y="73" class="b">manager</text><text x="241" y="167">research</text><text x="300" y="167">design</text><text x="359" y="167">write</text></g>
  <text x="300" y="218" text-anchor="middle" class="mut">one boss hands out work</text>
  <text x="300" y="236" text-anchor="middle" class="mut" style="fill:#15803d">very common</text>

  <text x="500" y="36" text-anchor="middle" class="b">Deeper hierarchy</text>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="500" y1="82" x2="453" y2="110" /><line x1="500" y1="82" x2="547" y2="110" />
    <line x1="453" y1="134" x2="429" y2="164" /><line x1="453" y1="134" x2="477" y2="164" />
    <line x1="547" y1="134" x2="523" y2="164" /><line x1="547" y1="134" x2="571" y2="164" />
  </g>
  <g fill="#ede9fe" stroke="#7c3aed">
    <rect x="455" y="56" width="90" height="26" rx="6" />
    <rect x="418" y="110" width="70" height="24" rx="6" /><rect x="512" y="110" width="70" height="24" rx="6" />
    <rect x="408" y="164" width="42" height="22" rx="5" /><rect x="456" y="164" width="42" height="22" rx="5" />
    <rect x="502" y="164" width="42" height="22" rx="5" /><rect x="550" y="164" width="42" height="22" rx="5" />
  </g>
  <g class="s" text-anchor="middle">
    <text x="500" y="73" class="b">manager</text><text x="453" y="126">research</text><text x="547" y="126">write</text>
    <text x="429" y="179" style="font-size:10px">web</text><text x="477" y="179" style="font-size:10px">facts</text>
    <text x="523" y="179" style="font-size:10px">style</text><text x="571" y="179" style="font-size:10px">cites</text>
  </g>
  <text x="500" y="218" text-anchor="middle" class="mut">teams inside teams</text>
  <text x="500" y="236" text-anchor="middle" class="mut" style="fill:#b45309">less common, more complex</text>

  <text x="700" y="36" text-anchor="middle" class="b">All-to-all</text>
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="690" y1="79" x2="710" y2="79" /><line x1="690" y1="163" x2="710" y2="163" />
    <line x1="655" y1="92" x2="655" y2="150" /><line x1="745" y1="92" x2="745" y2="150" />
    <line x1="690" y1="92" x2="710" y2="150" /><line x1="710" y1="92" x2="690" y2="150" />
  </g>
  <g fill="#ede9fe" stroke="#7c3aed">
    <rect x="620" y="66" width="70" height="26" rx="6" /><rect x="710" y="66" width="70" height="26" rx="6" />
    <rect x="620" y="150" width="70" height="26" rx="6" /><rect x="710" y="150" width="70" height="26" rx="6" />
  </g>
  <g class="s" text-anchor="middle"><text x="655" y="83">manager</text><text x="745" y="83">research</text><text x="655" y="167">design</text><text x="745" y="167">write</text></g>
  <text x="700" y="218" text-anchor="middle" class="mut">anyone messages anyone</text>
  <text x="700" y="236" text-anchor="middle" class="mut" style="fill:#b91c1c">rare, hard to predict</text>
</svg>
