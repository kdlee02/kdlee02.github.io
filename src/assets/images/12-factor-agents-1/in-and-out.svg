<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="t">
<title id="t">Factors 1 to 4. Two inputs you own go to the model: the prompt file (factor 2) and the context you chose, a summary plus this order only (factor 3). The model writes a form instead of a sentence: action create_payment_link, amount 10, recipient Max (factor 1). Your code checks the form and runs the real tool, so the model can only ask for actions you listed (factor 4).</title>
