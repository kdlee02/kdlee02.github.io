<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" role="img" aria-labelledby="t">
  <title id="t">The twelve factors in three groups. Inputs and outputs: 1 natural language to tool calls, 2 own your prompts, 3 own your context window, 4 tools are just structured outputs. State and control: 5 unify execution and business state, 6 launch, pause and resume with simple APIs, 7 contact humans with tool calls, 8 own your control flow. Growing without breaking: 9 compact errors into the context window, 10 small focused agents, 11 trigger from anywhere, 12 make your agent a stateless reducer.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .sub { fill: #475569; font-size: 12px; }
    .n { font-weight: 700; font-size: 13px; fill: #ffffff; }
    .b { font-weight: 700; font-size: 13px; }
    .g { fill: #64748b; font-size: 11.5px; }
  </style>
  <rect x="1" y="1" width="898" height="422" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- column 1: blue -->
  <rect x="14" y="14" width="284" height="54" rx="9" fill="#dbeafe" stroke="#2563eb" />
  <text x="156" y="37" text-anchor="middle" class="h">1–4 · Inputs and outputs</text>
  <text x="156" y="56" text-anchor="middle" class="sub">what the model reads and writes</text>

  <rect x="14" y="78" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="36" cy="100" r="13" fill="#2563eb" /><text x="36" y="105" text-anchor="middle" class="n">1</text>
  <text x="58" y="105" class="b">Natural language → tool calls</text>
  <text x="58" y="126" class="g">The model fills in a form, not prose</text>

  <rect x="14" y="160" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="36" cy="182" r="13" fill="#2563eb" /><text x="36" y="187" text-anchor="middle" class="n">2</text>
  <text x="58" y="187" class="b">Own your prompts</text>
  <text x="58" y="208" class="g">Versioned and tested like code</text>

  <rect x="14" y="242" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="36" cy="264" r="13" fill="#2563eb" /><text x="36" y="269" text-anchor="middle" class="n">3</text>
  <text x="58" y="269" class="b">Own your context window</text>
  <text x="58" y="290" class="g">You choose what the model reads</text>

  <rect x="14" y="324" width="284" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="36" cy="346" r="13" fill="#2563eb" /><text x="36" y="351" text-anchor="middle" class="n">4</text>
  <text x="58" y="351" class="b">Tools are just</text>
  <text x="58" y="368" class="b">structured outputs</text>
  <text x="58" y="390" class="g">A tool call is a filled-in form</text>

  <!-- column 2: green -->
  <rect x="308" y="14" width="284" height="54" rx="9" fill="#dcfce7" stroke="#16a34a" />
  <text x="450" y="37" text-anchor="middle" class="h">5–8 · State and control</text>
  <text x="450" y="56" text-anchor="middle" class="sub">long tasks, waiting, staying in charge</text>

  <rect x="308" y="78" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="330" cy="100" r="13" fill="#16a34a" /><text x="330" y="105" text-anchor="middle" class="n">5</text>
  <text x="352" y="105" class="b">Unify execution and</text>
  <text x="352" y="122" class="b">business state</text>
  <text x="352" y="142" class="g">One saved record of everything</text>

  <rect x="308" y="160" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="330" cy="182" r="13" fill="#16a34a" /><text x="330" y="187" text-anchor="middle" class="n">6</text>
  <text x="352" y="187" class="b">Launch, pause, resume</text>
  <text x="352" y="204" class="b">with simple APIs</text>
  <text x="352" y="224" class="g">Stop at a bookmark, pick up later</text>

  <rect x="308" y="242" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="330" cy="264" r="13" fill="#16a34a" /><text x="330" y="269" text-anchor="middle" class="n">7</text>
  <text x="352" y="269" class="b">Contact humans</text>
  <text x="352" y="286" class="b">with tool calls</text>
  <text x="352" y="306" class="g">ask_human is just another tool</text>

  <rect x="308" y="324" width="284" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="330" cy="346" r="13" fill="#16a34a" /><text x="330" y="351" text-anchor="middle" class="n">8</text>
  <text x="352" y="351" class="b">Own your control flow</text>
  <text x="352" y="372" class="g">Your code runs the loop and</text>
  <text x="352" y="388" class="g">enforces the rules</text>

  <!-- column 3: amber -->
  <rect x="602" y="14" width="284" height="54" rx="9" fill="#fef3c7" stroke="#d97706" />
  <text x="744" y="37" text-anchor="middle" class="h">9–12 · Growing without breaking</text>
  <text x="744" y="56" text-anchor="middle" class="sub">more failures, features, channels, traffic</text>

  <rect x="602" y="78" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="624" cy="100" r="13" fill="#d97706" /><text x="624" y="105" text-anchor="middle" class="n">9</text>
  <text x="646" y="105" class="b">Compact errors into</text>
  <text x="646" y="122" class="b">the context window</text>
  <text x="646" y="142" class="g">Short error notes so it can self-correct</text>

  <rect x="602" y="160" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="624" cy="182" r="13" fill="#d97706" /><text x="624" y="187" text-anchor="middle" class="n">10</text>
  <text x="646" y="187" class="b">Small, focused agents</text>
  <text x="646" y="208" class="g">Specialists plus a router</text>

  <rect x="602" y="242" width="284" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="624" cy="264" r="13" fill="#d97706" /><text x="624" y="269" text-anchor="middle" class="n">11</text>
  <text x="646" y="269" class="b">Trigger from anywhere</text>
  <text x="646" y="290" class="g">One agent, a thin adapter per channel</text>

  <rect x="602" y="324" width="284" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1" />
  <circle cx="624" cy="346" r="13" fill="#d97706" /><text x="624" y="351" text-anchor="middle" class="n">12</text>
  <text x="646" y="351" class="b">Make your agent a</text>
  <text x="646" y="368" class="b">stateless reducer</text>
  <text x="646" y="390" class="g">State + event in, action + state out</text>
</svg>
