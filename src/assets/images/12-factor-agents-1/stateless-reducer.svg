<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="t">
  <title id="t">The stateless reducer cycle. Load the state from the database, combine it with the new event, and pass both to the agent. The agent returns the next action and the updated state. Save the updated state, then run the action, whose result becomes the next event. The agent holds no memory of its own between turns, so any copy of it can handle the next turn.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .b { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .lab { fill: #334155; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #475569; }
  </style>
  <rect x="1" y="1" width="818" height="318" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- new event -->
  <rect x="310" y="20" width="200" height="48" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="410" y="40" text-anchor="middle" class="b">New event</text>
  <text x="410" y="58" text-anchor="middle" class="mut">message, tool result, approval</text>

  <!-- database -->
  <rect x="30" y="126" width="160" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="110" y="160" text-anchor="middle" class="b">Database</text>
  <text x="110" y="180" text-anchor="middle" class="mut">the saved state</text>

  <!-- agent -->
  <rect x="300" y="114" width="220" height="108" rx="10" fill="#ede9fe" stroke="#7c3aed" />
  <text x="410" y="144" text-anchor="middle" class="b">Agent</text>
  <text x="410" y="164" text-anchor="middle" class="mut">keeps no memory of its own</text>
  <text x="410" y="190" text-anchor="middle" class="mono">(state, event)</text>
  <text x="410" y="207" text-anchor="middle" class="mono">→ (action, new state)</text>

  <!-- run action -->
  <rect x="630" y="126" width="160" height="84" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="710" y="160" text-anchor="middle" class="b">Run the action</text>
  <text x="710" y="180" text-anchor="middle" class="mut">tool, reply or ask_human</text>

  <!-- arrows -->
  <line x1="410" y1="68" x2="410" y2="112" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <line x1="190" y1="148" x2="298" y2="148" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <text x="244" y="140" text-anchor="middle" class="lab">1. load state</text>
  <line x1="300" y1="190" x2="192" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <text x="246" y="208" text-anchor="middle" class="lab">2. save new state</text>
  <line x1="520" y1="168" x2="628" y2="168" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <text x="574" y="160" text-anchor="middle" class="lab">3. next action</text>
  <polyline points="710,126 710,44 512,44" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <text x="612" y="36" text-anchor="middle" class="lab">4. its result is the next event</text>

  <text x="410" y="268" text-anchor="middle" class="lab">All memory lives in the saved state, so a crash loses nothing</text>
  <text x="410" y="288" text-anchor="middle" class="lab">and any copy of the agent can take the next turn.</text>
</svg>
