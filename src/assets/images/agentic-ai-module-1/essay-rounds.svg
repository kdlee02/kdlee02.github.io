<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t">
<title id="t">Ng's essay writer in three rounds. Round 1, one prompt that writes the essay: it only covered the obvious points. Round 2, outline, search, then write: better, but choppy, as if pieces were glued together. Round 3, outline, search, draft, review, revise: now one step's whole job is to find choppy parts and fix them.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="288" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Round 1</text><rect x="110" y="34" width="92" height="44" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="156" y="61" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Write</text><text x="110" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start">only covered the obvious points</text><text x="20" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Round 2</text><rect x="110" y="118" width="92" height="44" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="156" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Outline</text><path d="M202 140L220 140" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="222" y="118" width="92" height="44" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="268" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Search</text><path d="M314 140L332 140" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="334" y="118" width="92" height="44" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="380" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Write</text><text x="110" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start">better, but choppy: pieces glued together</text><text x="20" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Round 3</text><rect x="110" y="202" width="92" height="44" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="156" y="229" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Outline</text><path d="M202 224L220 224" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="222" y="202" width="92" height="44" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="268" y="229" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Search</text><path d="M314 224L332 224" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="334" y="202" width="92" height="44" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="380" y="229" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Draft</text><path d="M426 224L444 224" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="446" y="202" width="92" height="44" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="492" y="229" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Review</text><path d="M538 224L556 224" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="558" y="202" width="92" height="44" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="604" y="229" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Revise</text><text x="110" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#14532d" text-anchor="start">one step now exists just to fix choppy parts</text>
</svg>
