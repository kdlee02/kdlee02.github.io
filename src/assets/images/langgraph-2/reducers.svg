<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t">
  <title id="t">The same three nodes with two different state definitions. node_2 returns doc1, doc2, doc3 and node_3 returns doc2, doc4, doc5. With no reducer, the documents field ends as doc2, doc4, doc5, because node_3 replaced node_2's list. With the add reducer, it ends as doc1, doc2, doc3, doc2, doc4, doc5: the lists are joined and doc2 appears twice.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #475569; }
    .chip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #1e293b; }
  </style>
  <rect x="1" y="1" width="778" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <text x="390" y="32" text-anchor="middle">node_2 returns <tspan class="b" style="fill:#6d28d9">[doc1, doc2, doc3]</tspan>, then node_3 returns <tspan class="b" style="fill:#15803d">[doc2, doc4, doc5]</tspan></text>

  <rect x="20" y="58" width="230" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="34" y="86" class="b">No reducer (default)</text>
  <text x="34" y="108" class="mono">documents: List[str]</text>
  <rect x="280" y="70" width="56" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" /><text x="308" y="88" text-anchor="middle" class="chip">doc2</text>
  <rect x="342" y="70" width="56" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" /><text x="370" y="88" text-anchor="middle" class="chip">doc4</text>
  <rect x="404" y="70" width="56" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" /><text x="432" y="88" text-anchor="middle" class="chip">doc5</text>
  <text x="280" y="120" class="mut">Overwritten: node_2's list is gone.</text>

  <rect x="20" y="154" width="230" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="34" y="182" class="b">add reducer</text>
  <text x="34" y="204" class="mono">Annotated[List[str], add]</text>
  <rect x="280" y="166" width="56" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" /><text x="308" y="184" text-anchor="middle" class="chip">doc1</text>
  <rect x="342" y="166" width="56" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" /><text x="370" y="184" text-anchor="middle" class="chip">doc2</text>
  <rect x="404" y="166" width="56" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" /><text x="432" y="184" text-anchor="middle" class="chip">doc3</text>
  <rect x="466" y="166" width="56" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" /><text x="494" y="184" text-anchor="middle" class="chip">doc2</text>
  <rect x="528" y="166" width="56" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" /><text x="556" y="184" text-anchor="middle" class="chip">doc4</text>
  <rect x="590" y="166" width="56" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" /><text x="618" y="184" text-anchor="middle" class="chip">doc5</text>
  <text x="280" y="216" class="mut">Added on: everything kept, doc2 appears twice.</text>

  <text x="390" y="262" text-anchor="middle" class="mut">Purple = from node_2. Green = from node_3.</text>
  <text x="390" y="280" text-anchor="middle" class="mut">Results from running the code on LangGraph 1.2.20.</text>
</svg>
