<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t">
<title id="t">The smallest graph. The state goes in as text "Hello", START leads to the one node, the node returns only the field it changed, text "Nice to meet you", LangGraph merges that into the state, and at END the state comes out as text "Nice to meet you".</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="248" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="60" width="150" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="85.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">State in</text><text x="95" y="104.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">{"text": "Hello"}</text><path d="M170 90L204 90" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><circle cx="238" cy="90" r="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="238" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a" text-anchor="middle">START</text><path d="M270 90L304 90" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="306" y="60" width="140" height="60" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="376" y="85.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">node</text><text x="376" y="104.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">def node(state)</tspan></text><path d="M446 90L480 90" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><circle cx="514" cy="90" r="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="514" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a" text-anchor="middle">END</text><path d="M546 90L572 90" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="574" y="50" width="166" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="657" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">State out</text><text x="657" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">{"text":</text><text x="657" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">"Nice to meet you"}</text><path d="M376 120L376 160" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="236" y="162" width="280" height="60" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="376" y="187.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#14532d" text-anchor="middle">returns only what changed</text><text x="376" y="206.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">{"text": "Nice to meet you"}</text><text x="528" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">LangGraph merges it</text><text x="528" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">into the state</text>
</svg>
