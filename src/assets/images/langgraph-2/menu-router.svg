<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t">
  <title id="t">A graph. START leads to get_user_query, then analyze_input. From analyze_input the path splits. If is_menu_related is True, it goes to search_menu_info, then generate_menu_response, then END. If False, it goes to generate_general_response, then END.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .node { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #1e293b; }
    .cond { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #b45309; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- middle row -->
  <rect x="20" y="143" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="51" y="167" text-anchor="middle" class="b">START</text>
  <rect x="102" y="141" width="136" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="170" y="167" text-anchor="middle" class="node">get_user_query</text>
  <rect x="258" y="141" width="124" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="320" y="167" text-anchor="middle" class="node">analyze_input</text>

  <line x1="82" y1="163" x2="98" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="238" y1="163" x2="254" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <!-- top row: menu path -->
  <rect x="430" y="50" width="140" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="500" y="76" text-anchor="middle" class="node">search_menu_info</text>
  <rect x="590" y="50" width="170" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="675" y="76" text-anchor="middle" class="node">generate_menu_response</text>
  <line x1="570" y1="72" x2="586" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <!-- bottom row: general path -->
  <rect x="426" y="232" width="190" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="521" y="258" text-anchor="middle" class="node">generate_general_response</text>
  <rect x="660" y="234" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="691" y="258" text-anchor="middle" class="b">END</text>
  <line x1="616" y1="254" x2="656" y2="254" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="691" y1="94" x2="691" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <!-- the split -->
  <path d="M382 155 H405 V72 H426" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#a)" />
  <path d="M382 171 H405 V254 H422" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#a)" />
  <text x="414" y="122" class="cond">is_menu_related: True</text>
  <text x="414" y="214" class="cond">is_menu_related: False</text>

  <text x="390" y="306" text-anchor="middle" class="mut">Purple = asks the model. Green = plain code. Orange = the conditional edge reading the state.</text>
</svg>
