<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t">
  <title id="t">Two ways to compare a question with a chunk. Search, the skim: the question and the chunk are each turned into numbers separately and the numbers are compared, which is fast enough for every chunk. Reranker, the interview: the question and the chunk are read together by one model that outputs a relevance score, which is slower, so it only runs on the shortlist.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 12px; }
    .xs { font-size: 11px; }
    .mut { fill: #64748b; font-size: 12px; }
    .ok { fill: #15803d; font-weight: 700; }
    .no { fill: #b91c1c; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Skim vs. interview</text>
  <rect x="24" y="50" width="324" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="186" y="74" text-anchor="middle" class="b">Search (the skim)</text>
  <text x="186" y="90" text-anchor="middle" class="mut">bi-encoder</text>
  <rect x="372" y="50" width="324" height="226" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="534" y="74" text-anchor="middle" class="b">Reranker (the interview)</text>
  <text x="534" y="90" text-anchor="middle" class="mut">cross-encoder</text>
  <rect x="44" y="104" width="130" height="30" rx="8" fill="#fff" stroke="#94a3b8" />
  <text x="109.0" y="123" text-anchor="middle" class="s">question</text>
  <rect x="198" y="104" width="130" height="30" rx="8" fill="#fff" stroke="#94a3b8" />
  <text x="263.0" y="123" text-anchor="middle" class="s">chunk</text>
  <line x1="109" y1="136" x2="109" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="263" y1="136" x2="263" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="44" y="152" width="130" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" />
  <text x="109.0" y="174" text-anchor="middle" class="s">384 numbers</text>
  <rect x="198" y="152" width="130" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" />
  <text x="263.0" y="174" text-anchor="middle" class="s">384 numbers</text>
  <line x1="120" y1="190" x2="176" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="252" y1="190" x2="196" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="126" y="212" width="120" height="30" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="186.0" y="231" text-anchor="middle" class="s">compare</text>
  <text x="186" y="264" text-anchor="middle" class="s">made apart, so chunks are done ahead</text>
  <rect x="392" y="104" width="130" height="30" rx="8" fill="#fff" stroke="#94a3b8" />
  <text x="457.0" y="123" text-anchor="middle" class="s">question</text>
  <rect x="546" y="104" width="130" height="30" rx="8" fill="#fff" stroke="#94a3b8" />
  <text x="611.0" y="123" text-anchor="middle" class="s">chunk</text>
  <line x1="457" y1="136" x2="500" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <line x1="611" y1="136" x2="568" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="442" y="162" width="184" height="36" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="534.0" y="184" text-anchor="middle" class="s">one model reads both</text>
  <line x1="534" y1="200" x2="534" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="474" y="212" width="120" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="534.0" y="231" text-anchor="middle" class="s">score</text>
  <text x="534" y="264" text-anchor="middle" class="s">read together, one pair at a time</text>
  <text x="186" y="300" text-anchor="middle" class="b s" style="fill:#1d4ed8">fast: works on all 349 chunks</text>
  <text x="534" y="300" text-anchor="middle" class="b s" style="fill:#b45309">slow but sharp: only the shortlist</text>
</svg>
