 -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">not one grid</text><rect x="512" y="50" width="148" height="50" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="586" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Reranker</text><path d="M660 75L674 75" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M586 100L586 128" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="512" y="130" width="148" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="586" y="175.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">a more powerful</text><text x="586" y="194.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">relevance model</text><rect x="676" y="50" width="148" height="50" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="750" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Answer model</text><path d="M750 100L750 128" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="676" y="130" width="148" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="750" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill=