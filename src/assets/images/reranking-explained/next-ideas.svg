<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 260" role="img" aria-labelledby="t">
<title id="t">Where researchers are pushing next, one idea per step of the pipeline. Chunking: let AI models decide where to cut, an often overlooked piece. Embedding model: fine-tune it with good and bad examples, then re-save every chunk. Adaptor: a full neural network or a transformer layer instead of one grid. Reranker: a more powerful relevance model. Answer model: fine-tune it to expect retrieved text, as in RA-DIT and InstructRetro.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="842" height="258" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
