  <title id="t">The R&amp;D question's 10 search results before and after reranking. Before, in search order: R&amp;D spending, plans to keep investing, long-term commitment, digital skills training, a partner growth initiative, licensing, how R&amp;D costs are counted, emissions, patents, and a carbon pledge. After reranking by score, the top five are plans to keep investing (2.64), R&amp;D spending (0.99), long-term commitment (-0.27), how R&amp;D costs are counted (-4.30, up from 7th), and licensing (-5.65, up from 6th). The digital skills and partner chunks fall to 9th and 8th.</title>
