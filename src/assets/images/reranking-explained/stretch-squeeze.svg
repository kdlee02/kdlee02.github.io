<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t">
  <title id="t">An illustration of what an adaptor learns. Every direction of a test question starts at 1. After the adaptor, some directions are stretched above 1 because they matter for your questions, some are squeezed close to 0 because they don't, and some are flipped below 0 because they point away from what users want.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 12px; }
    .xs { font-size: 11px; }
    .mut { fill: #64748b; font-size: 12px; }
    .ok { fill: #15803d; font-weight: 700; }
    .no { fill: #b91c1c; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Stretch, squeeze, flip</text>
  <line x1="24" y1="170" x2="696" y2="170" stroke="#94a3b8" />
  <line x1="24" y1="120" x2="696" y2="120" stroke="#94a3b8" stroke-dasharray="4 4" />
  <text x="28" y="102" class="xs mut">before: every</text>
  <text x="28" y="116" class="xs mut">direction = 1</text>
  <text x="28" y="184" class="xs mut">0</text>
  <rect x="150" y="75.0" width="34" height="95.0" rx="3" fill="#16a34a" />
  <rect x="204" y="120.0" width="34" height="50.0" rx="3" fill="#60a5fa" />
  <rect x="258" y="165.0" width="34" height="5.0" rx="3" fill="#94a3b8" />
  <rect x="312" y="95.0" width="34" height="75.0" rx="3" fill="#16a34a" />
  <rect x="366" y="170.0" width="34" height="40.0" rx="3" fill="#dc2626" />
  <rect x="420" y="167.5" width="34" height="2.5" rx="3" fill="#94a3b8" />
  <rect x="474" y="110.0" width="34" height="60.0" rx="3" fill="#16a34a" />
  <rect x="528" y="170.0" width="34" height="20.0" rx="3" fill="#dc2626" />
  <rect x="582" y="140.0" width="34" height="30.0" rx="3" fill="#60a5fa" />
  <rect x="636" y="85.0" width="34" height="85.0" rx="3" fill="#16a34a" />
  <g class="s b">
    <text x="167" y="60" text-anchor="middle" style="fill:#15803d">stretched</text>
    <text x="275" y="152" text-anchor="middle" style="fill:#64748b">squeezed</text>
    <text x="383" y="230" text-anchor="middle" style="fill:#b91c1c">flipped</text>
  </g>
  <text x="360" y="262" text-anchor="middle" class="s">Like the sliders on a music equalizer: turn up what matters, turn down the rest.</text>
  <text x="360" y="282" text-anchor="middle" class="mut">Made-up values for 10 of the 384 directions, to show the pattern the course’s bar chart reveals.</text>
</svg>
