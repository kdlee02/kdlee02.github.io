<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t">
  <title id="t">An example of training data, made up for illustration. For the question “How much did the company spend on research?”, an AI judge says yes to the chunk about R&amp;D spending of $24,512 million, which becomes +1, meaning point the same way. It says no to the chunk about digital skills training, which becomes -1, meaning point the opposite way.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 12px; }
    .xs { font-size: 11px; }
    .mut { fill: #64748b; font-size: 12px; }
    .ok { fill: #15803d; font-weight: 700; }
    .no { fill: #b91c1c; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Turning yes and no into +1 and −1</text>
  <rect x="24" y="52" width="672" height="34" rx="17" fill="#fef3c7" stroke="#d97706" />
  <text x="360" y="74" text-anchor="middle">Question: “How much did the company spend on research?”</text>
  <rect x="24" y="104" width="300" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="38" y="126" class="mut">chunk</text>
  <text x="38" y="146" class="s">“R&amp;D expenses were $24,512 million…”</text>
  <line x1="326" y1="132" x2="350" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="354" y="112" width="96" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="402" y="129" text-anchor="middle" class="xs">AI judge says</text>
  <text x="402" y="145" text-anchor="middle" class="ok">yes</text>
  <line x1="452" y1="132" x2="476" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="500" y="138" text-anchor="middle" class="h" style="fill:#16a34a">+1</text>
  <line x1="536" y1="132" x2="572" y2="132" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)" />
  <line x1="536" y1="140" x2="568" y2="140" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)" />
  <text x="584" y="140" class="s">same direction</text>
  <rect x="24" y="180" width="300" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="38" y="202" class="mut">chunk</text>
  <text x="38" y="222" class="s">“23 million people accessed digital skills…”</text>
  <line x1="326" y1="208" x2="350" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="354" y="188" width="96" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="402" y="205" text-anchor="middle" class="xs">AI judge says</text>
  <text x="402" y="221" text-anchor="middle" class="no">no</text>
  <line x1="452" y1="208" x2="476" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="500" y="214" text-anchor="middle" class="h" style="fill:#dc2626">−1</text>
  <line x1="536" y1="208" x2="572" y2="208" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)" />
  <line x1="572" y1="216" x2="540" y2="216" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)" />
  <text x="584" y="216" class="s">opposite direction</text>
  <text x="360" y="276" text-anchor="middle" class="mut">A made-up example. The course builds 150 pairs like this: 15 questions × 10 results each.</text>
</svg>
