<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t">
<title id="t">Two ways to pause. A breakpoint is set from outside at compile time with interrupt_before, always stops in front of the same nodes, and continues with stream(None, thread). interrupt() is called inside a node: the node pauses and hands the person a payload, here about_to_search: signature dish; the person resumes with Command(resume=...), here the query chef's signature steak, and that value becomes the return value of interrupt(), so the node carries on with it.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Breakpoint: set from outside</text><rect x="30" y="56" width="252" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="156" y="81.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">compile(</text><text x="156" y="100.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">interrupt_before=["retrieve"])</text><path d="M282 86L306 86" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="308" y="56" width="110" height="60" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="363" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">agent runs</text><path d="M418 86L446 86" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="448" y="56" width="120" height="60" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="508" y="81.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">pause</text><text x="508" y="100.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">before retrieve</text><path d="M568 86L602 86" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="604" y="56" width="136" height="60" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="672" y="81.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle">stream(None)</text><text x="672" y="100.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">carries on</text><path d="M30 146H740" stroke="#e2e8f0"/><text x="30" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">interrupt()</tspan>: called inside a node</text><rect x="30" y="198" width="170" height="76" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="115" y="231.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">human_review</tspan></text><text x="115" y="250.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">node runs</text><path d="M200 236L234 236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="236" y="198" width="170" height="76" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="321" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7f1d1d" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">interrupt(payload)</tspan></text><text x="321" y="241" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">about_to_search:</tspan></text><text x="321" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">"signature dish"</tspan></text><path d="M406 236L440 236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="442" y="198" width="150" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="517" y="231.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a" text-anchor="middle">A person replies</text><text x="517" y="250.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Command(resume=…)</tspan></text><path d="M592 236L616 236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="618" y="198" width="122" height="76" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="679" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#14532d" text-anchor="middle">node continues</text><text x="679" y="241" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">query: "chef's</text><text x="679" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">signature steak"</text>
</svg>
