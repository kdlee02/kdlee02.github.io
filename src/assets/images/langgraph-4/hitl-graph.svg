72a" text-anchor="middle">runs the search</text><path d="M462 120L494 120" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M496 120L560 74L624 120L560 166Z" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/><text x="560" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">relevant?</text><path d="M624 120L656 120" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="640" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">yes</text><rect x="658" y="88" width="82" height="64" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="699" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">generate</text><rect x="627" y="137" width="30" height="30" rx="15" fill="#fdecec" stroke="#b91c1c"/><rect x="636" y="145" width="4" height="14" fill="#b91c1c"/><rect x="644" y="145" width="4" height="14" fill="#b91c1c"/><path d="M699 152L699 232" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><circle cx="699" cy="262" r="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="699" y="267" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a" text-anchor="middle">END</text><path d="M560 166L560 230" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="574" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">no</text><rect x="470" y="232" width="170" height="64" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="555" y="259.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#1a24b8" text-anchor="middle">rewrite</text><text x="555" y="278.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">reword the question</text><path d="M470 264L192 264L192 154" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="330" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">back to agent, until <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">num_generations</tspan> = 2</text><path d="M192 88L192 46L270 46" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="232" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">no tool call</text><circle cx="296" cy="46" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="296" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a" text-anchor="middle">END</text><text x="52" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7f1d1d" text-anchor="middle">red pauses:</text><text x="52" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7f1d1d" text-anchor="middle">the breakpoints</text>
</svg>
