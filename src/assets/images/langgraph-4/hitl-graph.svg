<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t">
<title id="t">The graph used for the breakpoint runs. START, then agent, the model with search_menu. If it asks for a tool, retrieve runs the search; if not, END. After retrieve, grade_documents asks whether the results are relevant. Relevant: generate writes the answer, then END. Not relevant: rewrite rewords the question and goes back to agent, until num_generations reaches 2. The breakpoints stop the graph just before retrieve and just before generate.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="318" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
