<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t">
  <title id="t">The agent loop. A user question goes to the model. The model either asks for a tool or gives a final answer. If it asks for a tool, the tool runs and its result, the observation, goes back to the model, which decides again. The loop repeats until the model gives a final answer, which becomes the output.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .cond { fill: #b45309; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="20" y="112" width="120" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="80" y="141" text-anchor="middle" class="b">User question</text>
  <line x1="140" y1="136" x2="176" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="180" y="104" width="150" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="255" y="130" text-anchor="middle" class="b">Model</text>
  <text x="255" y="150" text-anchor="middle" class="mut">reason: what next?</text>

  <line x1="330" y1="136" x2="436" y2="136" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="383" y="126" text-anchor="middle" class="cond">asks for a tool</text>

  <rect x="440" y="104" width="140" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="510" y="130" text-anchor="middle" class="b">Tool runs</text>
  <text x="510" y="150" text-anchor="middle" class="mut">act</text>

  <path d="M510 168 V226 H255 V172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="383" y="246" text-anchor="middle" class="mut">observation: the tool's result goes back to the model</text>

  <path d="M255 104 V56 H680 V108" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="468" y="46" text-anchor="middle" class="cond">final answer: no more tools needed</text>

  <rect x="620" y="112" width="120" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="680" y="141" text-anchor="middle" class="b">Output</text>

  <text x="390" y="284" text-anchor="middle" class="mut">The loop repeats until the model answers without asking for a tool.</text>
</svg>
