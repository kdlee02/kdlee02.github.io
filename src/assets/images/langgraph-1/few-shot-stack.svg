<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t">
<title id="t">What the model receives for a few-shot tool prompt, top to bottom: the system message saying which tool is for what; the examples, a whole fake conversation where the assistant calls search_menu, then tavily_search, then blog_search for the truffle risotto; and last the real question. The model answers with the tool calls it wants, for example search_menu("pasta dish") for "Do you have a pasta dish?".</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="30" width="420" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#0f172a" text-anchor="middle">System message</text><text x="230" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle">menu → <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">search_menu</tspan> · facts → <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">tavily_search</tspan> · reviews → <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">blog_search</tspan></text><rect x="20" y="92" width="420" height="138" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 5"/><text x="36" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Examples: a fake conversation</text><rect x="36" y="126" width="388" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">user: truffle risotto price, features, reviews?</text><rect x="36" y="158" width="124" height="26" rx="6" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="98" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">search_menu</text><rect x="168" y="158" width="124" height="26" rx="6" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="230" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">tavily_search</text><rect x="300" y="158" width="124" height="26" rx="6" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="362" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">blog_search</text><rect x="36" y="192" width="388" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">assistant: final answer built from all three</text><rect x="20" y="242" width="420" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="230" y="267" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">Real question: "Do you have a pasta dish?"</text><path d="M440 156L500 156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="500" y="124" width="96" height="64" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="548" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model</text><path d="M596 156L618 156" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="620" y="112" width="120" height="88" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="680" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#14532d" text-anchor="middle">Tool call</text><text x="680" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">search_menu</text><text x="680" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">"pasta dish"</text>
