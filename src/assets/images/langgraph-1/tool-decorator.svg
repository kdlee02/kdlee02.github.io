<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t">
<title id="t">How the @tool decorator fills in the order slip from a plain function, one part at a time. The function name, blog_search, becomes the tool name. The type hint query: str becomes the schema. The docstring becomes the description. The function body stays code that the model never sees.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">@tool</tspan> reads a plain function and fills in the order slip</text><rect x="20" y="50" width="420" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="34" y="73.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">def blog_search(query: str):</text><text x="34" y="92.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">the function name</text><path d="M440 78L494 78" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="496" y="50" width="244" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="618" y="73.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">name</text><text x="618" y="92.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">blog_search</text><rect x="20" y="120" width="420" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="34" y="143.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">query: str</text><text x="34" y="162.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">the type hint</text><path d="M440 148L494 148" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="496" y="120" width="244" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="618" y="143.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">schema</text><text x="618" y="162.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">query: string</text><rect x="20" y="190" width="420" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="34" y="213.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">"""Search Naver blog posts. Use this for…"""</text><text x="34" y="232.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">the docstring</text><path d="M440 218L494 218" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="496" y="190" width="244" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="618" y="213.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">description</text><text x="618" y="232.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the docstring text</text><text x="380" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">The body, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">requests.get(…)</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">return […]</tspan>, stays code the model never sees</text>
</svg>
