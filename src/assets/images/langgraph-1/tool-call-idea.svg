<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t">
<title id="t">You ask "What is 2 times 3?". The model does not calculate: it writes a request naming the multiply tool with a = 2 and b = 3. Your program runs multiply(2, 3) and gets 6. Choosing the tool and filling in the request is the model's job; running it is yours.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="248" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="80" width="140" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="90" y="107.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Your question</text><text x="90" y="126.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">"What is 2 × 3?"</text><path d="M160 112L196 112" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="198" y="80" width="110" height="64" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="253" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model</text><path d="M308 112L344 112" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="346" y="70" width="180" height="84" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="436" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Tool request</text><text x="436" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">name: multiply</text><text x="436" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">args: {a: 2, b: 3}</text><path d="M526 112L562 112" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="564" y="80" width="176" height="64" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="652" y="107.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Your program</text><text x="652" y="126.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">multiply(2, 3) → 6</text><path d="M198 186H526" stroke="#1f2de6" stroke-width="3"/><text x="362" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">The model's job: choose the tool and fill in the form</text><path d="M564 186H740" stroke="#15803d" stroke-width="3"/><text x="652" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">Your job: run it</text><text x="380" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">The model never runs anything. It writes a request.</text>
