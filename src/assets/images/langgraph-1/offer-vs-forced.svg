<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t">
<title id="t">A tool is an offer. The question goes to a model with the search tool attached, and the code checks one thing: is tool_calls empty? In my run with gpt-5.4-mini it was empty, and the model answered directly: Cabernet Sauvignon. In the course run with gpt-4o-mini it held two searches, which your code runs first. Setting tool_choice to "any" removes the empty branch: the model must call a tool.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="120" width="150" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="145.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">"Recommend a wine</text><text x="95" y="164.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">that goes with steak."</text><path d="M170 150L198 150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="200" y="114" width="180" height="72" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="290" y="145.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model + tools</text><text x="290" y="164.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">bind_tools([search])</text><path d="M380 150L400 150" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M402 150L468 100L534 150L468 200Z" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/><text x="468" y="146.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">tool_calls</text><text x="468" y="163.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">empty?</text><path d="M534 150L560 150L560 76L580 76" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="548" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">yes</text><path d="M534 150L560 150L560 224L580 224" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="548" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">no</text><rect x="582" y="44" width="158" height="64" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="661" y="71.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Answer directly</text><text x="661" y="90.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">"Cabernet Sauvignon"</text><text x="661" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">my run, gpt-5.4-mini</text><rect x="582" y="192" width="158" height="64" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="661" y="219.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Run the tools first</text><text x="661" y="238.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">2 searches</text><text x="661" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">course run, gpt-4o-mini</text><text x="290" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle">tool_choice="any"</text><text x="290" y="246" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">removes the "yes" path</text>
</svg>
