<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t">
<title id="t">A tool has four parts. The name, the description and the input schema form the order slip the model reads. The function, the code that runs, stays in your program and the model never sees it.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="268" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="40" width="430" height="210" rx="12" fill="#ffffff" stroke="#1f2de6" stroke-dasharray="6 5"/><text x="235" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">What the model sees: the order slip</text><rect x="40" y="84" width="390" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="54" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">name   <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">tavily_search</tspan></text><rect x="40" y="136" width="390" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="54" y="163" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">description   "A search engine optimized for…"</text><rect x="40" y="188" width="390" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="54" y="215" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">schema   <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">query, include_domains, topic, …</tspan></text><rect x="480" y="40" width="260" height="210" rx="12" fill="#ffffff" stroke="#15803d" stroke-dasharray="6 5"/><text x="610" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Only your program sees</text><rect x="500" y="84" width="220" height="148" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="610" y="134.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">function</text><text x="610" y="153.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the code that runs:</text><text x="610" y="172.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">calls the search API</text><text x="610" y="191.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">and returns results</text>
</svg>
