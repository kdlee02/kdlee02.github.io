<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t">
<title id="t">Three ways to run the same tool call, which has a name, args and an id. One: invoke with only the args, and you get the raw search results with no id. Two: invoke with the whole tool call, and LangChain returns a ToolMessage with the id copied over; this is the one to remember. Three: build the ToolMessage yourself from the raw results and the id.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="318" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="120" width="170" height="84" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="105" y="138.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Tool call</text><text x="105" y="157.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">name: tavily_search</text><text x="105" y="176.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">args: {query: …}</text><text x="105" y="195.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">id: call_5lPOU0…</text><path d="M190 162L230 68" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="232" y="36" width="300" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="382" y="73" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">1.  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">web_search.invoke(args)</tspan></text><path d="M532 68L556 68" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="558" y="36" width="182" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="649" y="63.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Raw search results</text><text x="649" y="82.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">no id attached</text><path d="M190 162L230 160" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="232" y="128" width="300" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="382" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">2.  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">web_search.invoke(tool_call)</tspan></text><path d="M532 160L556 160" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="558" y="128" width="182" height="64" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="649" y="155.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">ToolMessage</text><text x="649" y="174.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">id copied over for you</text><path d="M190 162L230 252" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="232" y="220" width="300" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="382" y="257" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">3.  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ToolMessage(str(raw), tool_call_id=id)</tspan></text><path d="M532 252L556 252" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="558" y="220" width="182" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="649" y="247.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">ToolMessage</text><text x="649" y="266.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">you copy the id yourself</text><text x="646" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">Option 2 is the one to remember</text>
</svg>
