<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t">
  <title id="t">A web page, a slide and a PDF each mark the title "Ice Hockey" with a different clue: a tag, a title box, or big bold text. All three become the same list of labeled blocks: title, narrative text, list item, table, header or footer.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .mut { fill: #64748b; font-size: 12px; }
    .chip { font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Three formats, one set of building blocks</text>

  <!-- source files -->
  <g fill="#f8fafc" stroke="#94a3b8">
    <rect x="24" y="52" width="250" height="76" rx="8" />
    <rect x="24" y="138" width="250" height="76" rx="8" />
    <rect x="24" y="224" width="250" height="76" rx="8" />
  </g>
  <text x="36" y="74" class="b">Web page (HTML)</text>
  <text x="36" y="96" class="m" style="fill:#2563eb">&lt;h1&gt;Ice Hockey&lt;/h1&gt;</text>
  <text x="36" y="116" class="mut">Clue: the tag name</text>

  <text x="36" y="160" class="b">Slides (PowerPoint)</text>
  <rect x="36" y="168" width="110" height="24" rx="3" fill="#ffffff" stroke="#2563eb" stroke-dasharray="4 3" />
  <text x="46" y="185" class="b">Ice Hockey</text>
  <text x="154" y="185" class="mut">← title box</text>
  <text x="36" y="206" class="mut">Clue: where it sits on the slide</text>

  <text x="36" y="246" class="b">PDF or scanned page</text>
  <text x="36" y="272" class="b" style="font-size:18px">Ice Hockey</text>
  <text x="36" y="292" class="mut">Clue: big, bold text on the page</text>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M276 90 C310 90 316 176 340 176" /><path d="M276 176 L340 176" /><path d="M276 262 C310 262 316 176 340 176" />
  </g>
  <line x1="340" y1="176" x2="372" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <!-- normalized output -->
  <rect x="380" y="52" width="316" height="248" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="394" y="76" class="b">The same labeled blocks</text>
  <rect x="392" y="90" width="112" height="22" rx="11" fill="#dbeafe" stroke="#2563eb" />
  <text x="448" y="105" text-anchor="middle" class="chip" style="fill:#1d4ed8">Title</text>
  <text x="514" y="106">Ice Hockey</text>
  <rect x="392" y="130" width="112" height="22" rx="11" fill="#fef3c7" stroke="#d97706" />
  <text x="448" y="145" text-anchor="middle" class="chip" style="fill:#b45309">Narrative text</text>
  <text x="514" y="146">A team has six players…</text>
  <rect x="392" y="170" width="112" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" />
  <text x="448" y="185" text-anchor="middle" class="chip" style="fill:#15803d">List item</text>
  <text x="514" y="186">• Skates • Stick • Puck</text>
  <rect x="392" y="210" width="112" height="22" rx="11" fill="#ede9fe" stroke="#7c3aed" />
  <text x="448" y="225" text-anchor="middle" class="chip" style="fill:#6d28d9">Table</text>
  <text x="514" y="226">Rows and columns</text>
  <rect x="392" y="250" width="112" height="22" rx="11" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="448" y="265" text-anchor="middle" class="chip" style="fill:#475569">Header / Footer</text>
  <text x="514" y="266">Page 12</text>

  <text x="538" y="318" text-anchor="middle" class="mut">Your app only ever sees this list.</text>
</svg>
