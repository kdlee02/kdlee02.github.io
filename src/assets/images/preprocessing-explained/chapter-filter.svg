<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 315" role="img" aria-labelledby="t">
  <title id="t">Each paragraph points to its chapter title. A search for "How many players are on a team?" limited to the Ice Hockey chapter skips the Skiing paragraphs and finds a passage about each player knowing the other five, so a team has six players.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .mut { fill: #64748b; font-size: 12px; }
    .s { font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="313" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Tag each piece with its chapter, then search one chapter</text>

  <!-- skiing column (skipped) -->
  <g opacity="0.4">
    <rect x="24" y="56" width="190" height="32" rx="6" fill="#e2e8f0" stroke="#64748b" />
    <text x="119" y="77" text-anchor="middle" class="b">SKIING</text>
    <path d="M38 88 V229 M38 129 H48 M38 179 H48 M38 229 H48" stroke="#64748b" stroke-width="1.5" fill="none" />
    <g fill="#f8fafc" stroke="#94a3b8">
      <rect x="48" y="110" width="160" height="38" rx="5" /><rect x="48" y="160" width="160" height="38" rx="5" /><rect x="48" y="210" width="160" height="38" rx="5" />
    </g>
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <line x1="58" y1="123" x2="196" y2="123" /><line x1="58" y1="135" x2="160" y2="135" />
      <line x1="58" y1="173" x2="196" y2="173" /><line x1="58" y1="185" x2="170" y2="185" />
      <line x1="58" y1="223" x2="196" y2="223" /><line x1="58" y1="235" x2="150" y2="235" />
    </g>
  </g>
  <text x="119" y="268" text-anchor="middle" class="mut">skipped</text>

  <!-- hockey column (searched) -->
  <rect x="228" y="48" width="204" height="210" rx="10" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="236" y="56" width="190" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" />
  <text x="331" y="77" text-anchor="middle" class="b">ICE HOCKEY</text>
  <path d="M250 88 V229 M250 129 H260 M250 179 H260 M250 229 H260" stroke="#2563eb" stroke-width="1.5" fill="none" />
  <g fill="#fef3c7" stroke="#d97706">
    <rect x="260" y="110" width="160" height="38" rx="5" /><rect x="260" y="160" width="160" height="38" rx="5" stroke-width="2.5" /><rect x="260" y="210" width="160" height="38" rx="5" />
  </g>
  <g stroke="#fcd34d" stroke-width="3" stroke-linecap="round">
    <line x1="270" y1="123" x2="408" y2="123" /><line x1="270" y1="135" x2="372" y2="135" />
    <line x1="270" y1="173" x2="408" y2="173" /><line x1="270" y1="185" x2="382" y2="185" />
    <line x1="270" y1="223" x2="408" y2="223" /><line x1="270" y1="235" x2="362" y2="235" />
  </g>
  <text x="331" y="276" text-anchor="middle" class="mut">searched</text>

  <!-- query -->
  <rect x="460" y="56" width="236" height="36" rx="18" fill="#fef3c7" stroke="#d97706" />
  <text x="578" y="79" text-anchor="middle" style="font-size:12px">“How many players are on a team?”</text>
  <rect x="460" y="102" width="236" height="26" rx="13" fill="#ede9fe" stroke="#7c3aed" />
  <text x="578" y="120" text-anchor="middle" class="b" style="font-size:12px;fill:#6d28d9">only where chapter = Ice Hockey</text>
  <line x1="458" y1="115" x2="436" y2="115" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)" />

  <line x1="422" y1="179" x2="456" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="460" y="146" width="236" height="84" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="474" y="168" class="b" style="font-size:12px">Top match</text>
  <text x="474" y="188" class="s">“…each member of which knows</text>
  <text x="474" y="204" class="s">the play of the other five players.”</text>
  <text x="474" y="222" class="b" style="font-size:12px;fill:#15803d">→ a team has 6 players</text>

  <text x="360" y="300" text-anchor="middle" class="mut">Each paragraph’s parent label points to its chapter title, so other sports can’t sneak into the answer.</text>
</svg>
