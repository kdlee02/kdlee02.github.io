<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t">
  <title id="t">Asked for the latest Super Bowl news, meaning-only search returns both a February 11 preview and the February 12 result. Hybrid search adds a date filter and returns only the result.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .mut { fill: #64748b; font-size: 12px; }
    .d { font-weight: 700; font-size: 12px; }
  </style>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Meaning search vs. hybrid search</text>
  <rect x="380" y="16" width="316" height="32" rx="16" fill="#fef3c7" stroke="#d97706" />
  <text x="538" y="37" text-anchor="middle">“What’s the latest Super Bowl news?”</text>

  <!-- row 1 -->
  <text x="24" y="98" class="b" style="font-size:14px">Meaning only</text>
  <text x="24" y="118" class="mut">Both are about the</text>
  <text x="24" y="134" class="mut">Super Bowl, so both come back</text>
  <rect x="250" y="76" width="214" height="56" rx="8" fill="#fff7ed" stroke="#d97706" />
  <text x="264" y="98" class="d">Feb 11</text>
  <text x="450" y="98" text-anchor="end" style="fill:#dc2626;font-size:11px;font-weight:700">OUT OF DATE</text>
  <text x="264" y="118">Who’s favored to win?</text>
  <rect x="482" y="76" width="214" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="496" y="98" class="d">Feb 12</text>
  <text x="496" y="118">Final score and MVP</text>

  <line x1="24" y1="160" x2="696" y2="160" stroke="#e2e8f0" />

  <!-- row 2 -->
  <text x="24" y="198" class="b" style="font-size:14px">Meaning + filter</text>
  <rect x="24" y="210" width="128" height="24" rx="12" fill="#ede9fe" stroke="#7c3aed" />
  <text x="88" y="226" text-anchor="middle" class="d" style="fill:#6d28d9">date ≥ Feb 12</text>
  <rect x="250" y="176" width="214" height="56" rx="8" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4" />
  <text x="264" y="198" class="d" style="fill:#94a3b8">Feb 11</text>
  <text x="264" y="218" style="fill:#94a3b8">Who’s favored to win?</text>
  <text x="450" y="198" text-anchor="end" style="fill:#94a3b8;font-size:11px;font-weight:700">FILTERED OUT</text>
  <line x1="262" y1="214" x2="410" y2="214" stroke="#94a3b8" />
  <rect x="482" y="176" width="214" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="496" y="198" class="d">Feb 12</text>
  <text x="496" y="218">Final score and MVP</text>
  <text x="682" y="198" text-anchor="end" style="fill:#15803d;font-size:11px;font-weight:700">✓</text>

  <text x="360" y="276" text-anchor="middle" class="mut">The filter uses a label (the date) that meaning alone can’t see.</text>
</svg>
