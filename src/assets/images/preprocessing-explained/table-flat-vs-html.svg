<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t">
  <title id="t">A small table of hockey teams with wins and losses. Read as plain text, it becomes one long line of words and numbers where you can't tell which number goes where. Saved as an HTML table, every number stays in its row and column.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .mut { fill: #64748b; font-size: 12px; }
    .tag { fill: #2563eb; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="268" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Why tables need special care</text>

  <text x="36" y="76" class="b">The table on the page</text>
  <rect x="36" y="90" width="206" height="120" fill="#ffffff" stroke="#94a3b8" />
  <rect x="36" y="90" width="206" height="30" fill="#e2e8f0" stroke="#94a3b8" />
  <g stroke="#cbd5e1"><line x1="36" y1="150" x2="242" y2="150" /><line x1="36" y1="180" x2="242" y2="180" /><line x1="122" y1="90" x2="122" y2="210" /><line x1="182" y1="90" x2="182" y2="210" /></g>
  <g text-anchor="middle">
    <text x="79" y="110" class="b">Team</text><text x="152" y="110" class="b">Wins</text><text x="212" y="110" class="b">Losses</text>
    <text x="79" y="140">Eagles</text><text x="152" y="140">12</text><text x="212" y="140">4</text>
    <text x="79" y="170">Bears</text><text x="152" y="170">9</text><text x="212" y="170">7</text>
    <text x="79" y="200">Owls</text><text x="152" y="200">5</text><text x="212" y="200">11</text>
  </g>

  <path d="M250 130 C272 130 276 96 294 96" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <path d="M250 170 C272 170 276 196 294 196" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="300" y="56" width="396" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" />
  <text x="314" y="78" class="b">Read as plain text</text>
  <text x="314" y="102" class="m">Team Wins Losses Eagles 12 4 Bears 9 7 Owls 5 11</text>
  <text x="314" y="124" style="fill:#dc2626;font-size:12px;font-weight:700">Which number goes with which team and column?</text>

  <rect x="300" y="150" width="396" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" />
  <text x="314" y="172" class="b">Saved as an HTML table</text>
  <text x="314" y="194" class="m"><tspan class="tag">&lt;tr&gt;&lt;td&gt;</tspan>Eagles<tspan class="tag">&lt;/td&gt;&lt;td&gt;</tspan>12<tspan class="tag">&lt;/td&gt;&lt;td&gt;</tspan>4<tspan class="tag">&lt;/td&gt;&lt;/tr&gt;</tspan></text>
  <text x="314" y="212" class="m"><tspan class="tag">&lt;tr&gt;&lt;td&gt;</tspan>Bears<tspan class="tag">&lt;/td&gt;&lt;td&gt;</tspan>9<tspan class="tag">&lt;/td&gt;&lt;td&gt;</tspan>7<tspan class="tag">&lt;/td&gt;&lt;/tr&gt;</tspan></text>
  <text x="314" y="230" style="fill:#15803d;font-size:12px;font-weight:700">Every number stays in its row and column.</text>

  <text x="360" y="258" text-anchor="middle" class="mut">AI models read HTML tables well, so this is the format to aim for.</text>
</svg>
