<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t">
  <title id="t">A vision transformer takes a picture of the page, plus an optional prompt, and writes out the labeled blocks as JSON text in one step, with no boxes and no separate OCR.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
    .k { fill: #93c5fd; }
    .s { fill: #fcd34d; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .mut { fill: #64748b; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="248" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Method 2: Vision transformer (one step)</text>

  <rect x="24" y="60" width="130" height="160" rx="3" fill="#ffffff" stroke="#94a3b8" />
  <rect x="36" y="74" width="84" height="11" rx="2" fill="#1e293b" />
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
    <line x1="36" y1="102" x2="142" y2="102" /><line x1="36" y1="114" x2="134" y2="114" /><line x1="36" y1="126" x2="110" y2="126" />
    <line x1="36" y1="148" x2="142" y2="148" /><line x1="36" y1="160" x2="128" y2="160" /><line x1="36" y1="172" x2="142" y2="172" /><line x1="36" y1="184" x2="96" y2="184" />
  </g>
  <text x="89" y="238" text-anchor="middle" class="mut">picture of the page</text>

  <rect x="186" y="48" width="190" height="30" rx="15" fill="#fef3c7" stroke="#d97706" />
  <text x="281" y="67" text-anchor="middle" style="font-size:11px">optional prompt: “find dates”</text>
  <line x1="281" y1="80" x2="281" y2="104" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)" />

  <line x1="160" y1="140" x2="202" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="206" y="108" width="150" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="281" y="134" text-anchor="middle" class="b">Vision transformer</text>
  <text x="281" y="154" text-anchor="middle" style="font-size:11px">reads the whole page</text>
  <line x1="362" y1="140" x2="398" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="404" y="52" width="292" height="164" rx="8" fill="#0f172a" />
  <text x="420" y="78" class="m">[</text>
  <text x="420" y="98" class="m" xml:space="preserve">  {<tspan class="k">"type"</tspan>: <tspan class="s">"Title"</tspan>,</text>
  <text x="420" y="118" class="m" xml:space="preserve">   <tspan class="k">"text"</tspan>: <tspan class="s">"Storm warning"</tspan>},</text>
  <text x="420" y="138" class="m" xml:space="preserve">  {<tspan class="k">"type"</tspan>: <tspan class="s">"NarrativeText"</tspan>,</text>
  <text x="420" y="158" class="m" xml:space="preserve">   <tspan class="k">"text"</tspan>: <tspan class="s">"Heavy rain is…"</tspan>}</text>
  <text x="420" y="178" class="m">]</text>
  <text x="550" y="238" text-anchor="middle" class="mut">Writes the labeled blocks directly. No boxes, no OCR.</text>
</svg>
