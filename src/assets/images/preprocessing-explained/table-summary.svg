<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" role="img" aria-labelledby="t">
  <title id="t">An AI writes a short summary of a table. A question matches the summary, and then the full table is handed to the AI to answer from.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 12px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .mut { fill: #64748b; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="213" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Search the summary, hand over the table</text>

  <rect x="24" y="60" width="160" height="96" fill="#ffffff" stroke="#94a3b8" />
  <rect x="24" y="60" width="160" height="24" fill="#e2e8f0" stroke="#94a3b8" />
  <g stroke="#cbd5e1"><line x1="24" y1="108" x2="184" y2="108" /><line x1="24" y1="132" x2="184" y2="132" /><line x1="88" y1="60" x2="88" y2="156" /><line x1="136" y1="60" x2="136" y2="156" /></g>
  <g text-anchor="middle" style="font-size:11px">
    <text x="56" y="76" class="b" style="font-size:11px">Team</text><text x="112" y="76" class="b" style="font-size:11px">Wins</text><text x="160" y="76" class="b" style="font-size:11px">Losses</text>
    <text x="56" y="100" style="font-size:11px">Eagles</text><text x="112" y="100" style="font-size:11px">12</text><text x="160" y="100" style="font-size:11px">4</text>
    <text x="56" y="124" style="font-size:11px">Bears</text><text x="112" y="124" style="font-size:11px">9</text><text x="160" y="124" style="font-size:11px">7</text>
    <text x="56" y="148" style="font-size:11px">Owls</text><text x="112" y="148" style="font-size:11px">5</text><text x="160" y="148" style="font-size:11px">11</text>
  </g>

  <line x1="192" y1="108" x2="238" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="215" y="98" text-anchor="middle" class="mut" style="font-size:10px">AI writes</text>
  <rect x="244" y="72" width="210" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="256" y="94" class="b">Summary</text>
  <text x="256" y="114">The Eagles won the most games;</text>
  <text x="256" y="132">the Owls lost the most.</text>

  <rect x="480" y="52" width="216" height="34" rx="17" fill="#fef3c7" stroke="#d97706" />
  <text x="588" y="74" text-anchor="middle">“Which team won the most?”</text>
  <line x1="510" y1="88" x2="460" y2="104" stroke="#d97706" stroke-width="2" marker-end="url(#a)" />
  <text x="496" y="112" style="fill:#b45309;font-size:11px;font-weight:700">matches the summary</text>

  <rect x="560" y="124" width="136" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="628" y="143" text-anchor="middle" class="b">AI answers from</text>
  <text x="628" y="159" text-anchor="middle" class="b">the full table</text>
  <path d="M104 160 C104 200 600 202 624 172" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)" />
  <text x="360" y="182" text-anchor="middle" style="fill:#6d28d9;font-size:11px;font-weight:700">full table handed over</text>
</svg>
