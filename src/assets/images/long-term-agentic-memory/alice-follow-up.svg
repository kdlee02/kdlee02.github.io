<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t">
  <title id="t">Alice's two emails, before and after one added sentence. Before, with the course's instructions: on email 1 the agent searched memory and found only the Jim fact at 0.26, sent a reply, and never called manage_memory, so nothing about Alice was saved. On email 2 it searched and again found only the Jim fact at 0.22, sent no reply, and asked John what Alice's original ask was. After, with “After replying, always save any promises or open requests with manage_memory” added: on email 1 it searched and found only the Jim fact at 0.25, sent a reply, then called manage_memory and saved an action item saying Alice is awaiting a follow-up. On email 2 it found the action item at 0.35 ahead of the Jim fact at 0.21, drafted a reply, and asked John before sending.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 12px; }
    .mut { fill: #64748b; }
    .b { font-weight: 700; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; }
  </style>
  <rect x="1" y="1" width="778" height="398" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <text x="24" y="32" class="b">Before: the course’s instructions</text>
  <text x="408" y="32" class="b">After: one sentence added</text>
  <line x1="390" y1="18" x2="390" y2="384" stroke="#e2e8f0" stroke-width="2" />

  <text x="24" y="62" class="mut">Email 1: Alice asks about the API docs</text>
  <text x="408" y="62" class="mut">Email 1: Alice asks about the API docs</text>

  <g fill="#ede9fe" stroke="#7c3aed">
    <rect x="24" y="72" width="350" height="44" rx="8" /><rect x="408" y="72" width="350" height="44" rx="8" />
  </g>
  <g fill="#dcfce7" stroke="#16a34a">
    <rect x="24" y="124" width="350" height="44" rx="8" /><rect x="408" y="124" width="350" height="44" rx="8" />
  </g>
  <rect x="24" y="176" width="350" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 4" />
  <rect x="408" y="176" width="350" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" />

  <text x="38" y="91" class="mono">search_memory</text><text x="38" y="107">found only the Jim fact (0.26)</text>
  <text x="422" y="91" class="mono">search_memory</text><text x="422" y="107">found only the Jim fact (0.25)</text>
  <text x="38" y="143" class="mono">write_email</text><text x="38" y="159">reply sent to Alice</text>
  <text x="422" y="143" class="mono">write_email</text><text x="422" y="159">reply sent to Alice</text>
  <text x="38" y="195" class="mono" style="fill:#b91c1c">manage_memory</text><text x="38" y="211">never called: nothing about Alice saved</text>
  <text x="422" y="195" class="mono" style="fill:#1d4ed8">manage_memory</text><text x="422" y="211">saved an action item: Alice awaits a follow-up</text>

  <text x="24" y="250" class="mut">Email 2: “Any update on my previous ask?”</text>
  <text x="408" y="250" class="mut">Email 2: “Any update on my previous ask?”</text>

  <g fill="#ede9fe" stroke="#7c3aed">
    <rect x="24" y="260" width="350" height="50" rx="8" /><rect x="408" y="260" width="350" height="50" rx="8" />
  </g>
  <rect x="24" y="318" width="350" height="56" rx="8" fill="#fef3c7" stroke="#d97706" />
  <rect x="408" y="318" width="350" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />

  <text x="38" y="279" class="mono">search_memory</text><text x="38" y="297">found only the Jim fact (0.22)</text>
  <text x="422" y="279" class="mono">search_memory</text><text x="422" y="297">found Alice’s action item (0.35), then Jim (0.21)</text>
  <text x="38" y="337" class="b">No reply sent</text>
  <text x="38" y="355">asked John: “What was Alice’s original ask?”</text>
  <text x="422" y="337" class="b">Drafted a reply</text>
  <text x="422" y="355">asked John before sending it</text>
</svg>
