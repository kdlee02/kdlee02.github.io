<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="t">
<title id="t">Adding semantic memory. The response agent gets two more tools and decides when to use them: manage_memory creates, updates or deletes a memory, and search_memory returns up to 10 of the closest memories by meaning. Both work on one drawer of the store, named email_assistant / lance / collection. Each memory, like "Jim is John Doe's friend.", is saved as text plus an embedding from text-embedding-3-small. In a new conversation, "who is jim?" led to a search for "Jim" that found it with a score of 0.39.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="288" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
