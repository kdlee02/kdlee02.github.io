"none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M450 192L498 180" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="500" y="40" width="280" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="640" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">One drawer of the store</text><text x="640" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">email_assistant / lance / collection</text><rect x="520" y="106" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="640" y="131" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="middle">"Jim is John Doe's friend."</text><text x="640" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">saved as text + an embedding</text><text x="640" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">text-embedding-3-small</tspan></text><text x="400" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">New conversation: "who is jim?" → search "Jim" → found it, score 0.39</text>
