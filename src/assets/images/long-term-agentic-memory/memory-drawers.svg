<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t">
  <title id="t">One store, three drawers. Semantic memory lives in email_assistant / user / collection, holds facts like “Jim is John Doe's friend.”, is written by the response agent if it chooses to, and is read when the agent chooses to search. Episodic memory lives in email_assistant / user / examples, holds past emails with their label, is written by a person labeling an email, and is read automatically on every triage. Procedural memory lives in a drawer named after the user, holds the four instruction texts, is written by the optimizer from feedback, and is read automatically on every run.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  </style>
  <rect x="1" y="1" width="778" height="358" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="150" y="20" width="195" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" />
  <rect x="355" y="20" width="195" height="48" rx="8" fill="#fef3c7" stroke="#d97706" />
  <rect x="560" y="20" width="195" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <g text-anchor="middle">
    <text x="247" y="41" class="b">Semantic</text><text x="247" y="58" class="mut">facts</text>
    <text x="452" y="41" class="b">Episodic</text><text x="452" y="58" class="mut">examples</text>
    <text x="657" y="41" class="b">Procedural</text><text x="657" y="58" class="mut">instructions</text>
  </g>

  <g fill="#f8fafc" stroke="#e2e8f0">
    <rect x="150" y="80" width="195" height="60" rx="8" /><rect x="355" y="80" width="195" height="60" rx="8" /><rect x="560" y="80" width="195" height="60" rx="8" />
    <rect x="150" y="150" width="195" height="60" rx="8" /><rect x="355" y="150" width="195" height="60" rx="8" /><rect x="560" y="150" width="195" height="60" rx="8" />
    <rect x="150" y="220" width="195" height="60" rx="8" /><rect x="355" y="220" width="195" height="60" rx="8" /><rect x="560" y="220" width="195" height="60" rx="8" />
    <rect x="150" y="290" width="195" height="52" rx="8" /><rect x="355" y="290" width="195" height="52" rx="8" /><rect x="560" y="290" width="195" height="52" rx="8" />
  </g>

  <text x="24" y="115" class="b">Drawer</text>
  <text x="24" y="185" class="b">What’s inside</text>
  <text x="24" y="255" class="b">Who writes it</text>
  <text x="24" y="321" class="b">When it’s read</text>

  <g text-anchor="middle">
    <text x="247" y="106" class="mono">email_assistant /</text><text x="247" y="122" class="mono">user / collection</text>
    <text x="452" y="106" class="mono">email_assistant /</text><text x="452" y="122" class="mono">user / examples</text>
    <text x="657" y="114" class="mono">user</text>

    <text x="247" y="176">Facts, like “Jim is</text><text x="247" y="194">John Doe’s friend.”</text>
    <text x="452" y="176">Past emails with</text><text x="452" y="194">their label</text>
    <text x="657" y="176">The four instruction</text><text x="657" y="194">texts</text>

    <text x="247" y="246">The response agent,</text><text x="247" y="264">if it chooses to</text>
    <text x="452" y="246">A person, by</text><text x="452" y="264">labeling an email</text>
    <text x="657" y="246">The optimizer,</text><text x="657" y="264">from feedback</text>

    <text x="247" y="312">When the agent</text><text x="247" y="329">chooses to search</text>
    <text x="452" y="312">Every triage,</text><text x="452" y="329">automatically</text>
    <text x="657" y="312">Every run,</text><text x="657" y="329">automatically</text>
  </g>
</svg>
