<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t">
  <title id="t">Three kinds of memory. Semantic memory is facts: in people, things you learned in school; in an agent, facts about people, places and things; in the email assistant, “Jim is John’s friend”. Episodic memory is experiences: in people, a trip to Disneyland; in an agent, past examples of what it did; in the email assistant, an earlier email and how it was sorted. Procedural memory is knowing how: in people, riding a bike; in an agent, its system prompt; in the email assistant, a rule like “ignore marketing newsletters”.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
  </style>
  <rect x="1" y="1" width="778" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="150" y="20" width="195" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" />
  <rect x="355" y="20" width="195" height="48" rx="8" fill="#fef3c7" stroke="#d97706" />
  <rect x="560" y="20" width="195" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <g text-anchor="middle">
    <text x="247" y="41" class="b">Semantic</text><text x="247" y="58" class="mut">facts</text>
    <text x="452" y="41" class="b">Episodic</text><text x="452" y="58" class="mut">experiences</text>
    <text x="657" y="41" class="b">Procedural</text><text x="657" y="58" class="mut">knowing how</text>
  </g>

  <g fill="#f8fafc" stroke="#e2e8f0">
    <rect x="150" y="80" width="195" height="64" rx="8" /><rect x="355" y="80" width="195" height="64" rx="8" /><rect x="560" y="80" width="195" height="64" rx="8" />
    <rect x="150" y="156" width="195" height="64" rx="8" /><rect x="355" y="156" width="195" height="64" rx="8" /><rect x="560" y="156" width="195" height="64" rx="8" />
    <rect x="150" y="232" width="195" height="80" rx="8" /><rect x="355" y="232" width="195" height="80" rx="8" /><rect x="560" y="232" width="195" height="80" rx="8" />
  </g>

  <text x="24" y="117" class="b">In people</text>
  <text x="24" y="193" class="b">In an agent</text>
  <text x="24" y="267" class="b">In the email</text>
  <text x="24" y="285" class="b">assistant</text>

  <g text-anchor="middle">
    <text x="247" y="108">Things you learned,</text><text x="247" y="126">like facts from school</text>
    <text x="452" y="108">Things that happened,</text><text x="452" y="126">like a trip to Disneyland</text>
    <text x="657" y="108">Knowing how to do</text><text x="657" y="126">something, like riding a bike</text>

    <text x="247" y="184">Facts about people,</text><text x="247" y="202">places and things</text>
    <text x="452" y="184">Past examples of</text><text x="452" y="202">what it did</text>
    <text x="657" y="184">Its instructions:</text><text x="657" y="202">the system prompt</text>

    <text x="247" y="266">“Jim is John’s friend”</text>
    <text x="452" y="258">An earlier email and</text><text x="452" y="276">how it was sorted</text>
    <text x="657" y="258">“Ignore marketing</text><text x="657" y="276">newsletters”</text>

    <text x="247" y="300" class="mut">this post</text>
    <text x="452" y="300" class="mut">part 2</text>
    <text x="657" y="300" class="mut">part 2</text>
  </g>
</svg>
