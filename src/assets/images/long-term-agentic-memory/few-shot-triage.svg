<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t">
  <title id="t">Episodic memory in the triage step. John labels an email, and it is saved in the examples drawer, for example Tom Jones's “Hi John - want to buy documentation?” labeled ignore. When a new email arrives, the triage step searches that drawer for the most similar past emails, pastes them with their labels into the triage prompt, and the model picks a label, here ignore.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="24" y="40" width="110" height="60" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="79" y="75" text-anchor="middle">New email</text>
  <line x1="135" y1="70" x2="162" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="164" y="40" width="200" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="264" y="64" text-anchor="middle" class="b">Search examples</text>
  <text x="264" y="84" text-anchor="middle" class="mut">most similar past emails</text>
  <line x1="365" y1="70" x2="392" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="394" y="40" width="200" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="494" y="64" text-anchor="middle" class="b">Triage prompt</text>
  <text x="494" y="84" text-anchor="middle" class="mut">rules + those examples</text>
  <line x1="595" y1="70" x2="622" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="624" y="40" width="132" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" />
  <text x="690" y="64" text-anchor="middle" class="mut">label</text>
  <text x="690" y="84" text-anchor="middle" class="b">ignore</text>

  <rect x="164" y="160" width="592" height="110" rx="10" fill="#fffbeb" stroke="#d97706" />
  <text x="184" y="186" class="b">Examples drawer</text>
  <text x="310" y="186" class="mono" style="fill:#92400e">email_assistant / harrison / examples</text>
  <rect x="184" y="202" width="552" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" />
  <text x="200" y="223">Tom Jones: “Hi John - want to buy documentation?”</text>
  <text x="200" y="241" class="mut">label: <tspan class="b" style="fill:#1e293b">ignore</tspan></text>

  <line x1="264" y1="159" x2="264" y2="103" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="274" y="136" class="mut">closest matches</text>

  <rect x="24" y="185" width="110" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="79" y="210" text-anchor="middle">John labels</text>
  <text x="79" y="228" text-anchor="middle">an email</text>
  <line x1="135" y1="215" x2="162" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
</svg>
