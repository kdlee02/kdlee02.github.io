<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t">
  <title id="t">The R&amp;D question returned 5 chunks. Three are about research and development: R&amp;D expenses of $24,512 million, up 18 percent; plans to keep investing in R&amp;D and Microsoft Research; and a long-term commitment to R&amp;D. Two are distractors about digital skills training and a partner growth initiative. The Michael Jordan question returned 5 chunks and none are relevant.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 12px; }
    .mut { fill: #64748b; font-size: 12px; }
    .ok { fill: #15803d; font-weight: 700; }
    .no { fill: #b91c1c; font-weight: 700; }
    .halo { stroke: #f8fafc; stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Five results, but not five good ones</text>
  <text x="24" y="60" class="b">“What has been the investment in research and development?”</text>
  <rect x="24" y="74" width="436" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="38" y="97" class="ok">✓</text>
  <text x="58" y="97" class="s">R&amp;D expenses were $24,512 million, up 18%</text>
  <rect x="24" y="118" width="436" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="38" y="141" class="ok">✓</text>
  <text x="58" y="141" class="s">Plans to keep investing in R&amp;D, plus Microsoft Research</text>
  <rect x="24" y="162" width="436" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="38" y="185" class="ok">✓</text>
  <text x="58" y="185" class="s">Long-term commitment to R&amp;D in cloud, AI and devices</text>
  <rect x="24" y="206" width="436" height="36" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="38" y="229" class="no">✗</text>
  <text x="58" y="229" class="s">23 million people used digital skills training</text>
  <text x="446" y="229" text-anchor="end" class="no s">distractor</text>
  <rect x="24" y="250" width="436" height="36" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="38" y="273" class="no">✗</text>
  <text x="58" y="273" class="s">Black Partner Growth Initiative and skills programs</text>
  <text x="446" y="273" text-anchor="end" class="no s">distractor</text>
  <rect x="480" y="74" width="216" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="494" y="98" class="b s">“What has Michael Jordan</text>
  <text x="494" y="114" class="b s">done for us lately?”</text>
  <text x="494" y="142" class="s">✗  business metrics</text>
  <text x="494" y="162" class="s">✗  employee rewards</text>
  <text x="494" y="182" class="s">✗  commitment to R&amp;D</text>
  <text x="494" y="202" class="s">✗  how metrics are reported</text>
  <text x="494" y="222" class="s">✗  the CEO’s closing letter</text>
  <text x="494" y="268" class="no">0 of 5 relevant</text>
  <text x="360" y="316" text-anchor="middle" class="mut">Search always returns its top 5, even when nothing fits. The misses become distractors for the AI.</text>
</svg>
