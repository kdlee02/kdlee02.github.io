<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t">
  <title id="t">Expansion with multiple questions. The original question about what increased revenue goes to an AI, which writes five related questions: decreases in revenue, sources of revenue, sales by product line, pricing changes, and new customers. All six questions go to Chroma in one call, each returns 5 chunks, and duplicates are removed. On the map, the extra questions land in different places, so the results come from several parts of the report instead of one.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 12px; }
    .mut { fill: #64748b; font-size: 12px; }
    .ok { fill: #15803d; font-weight: 700; }
    .no { fill: #b91c1c; font-weight: 700; }
    .halo { stroke: #f8fafc; stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Ask several related questions at once</text>
  <rect x="24" y="54" width="300" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="38" y="73" class="s">“What were the most important factors that</text>
  <text x="38" y="89" class="s">contributed to increases in revenue?”</text>
  <line x1="174" y1="100" x2="174" y2="114" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="24" y="130" class="mut">An AI suggests five related questions:</text>
  <rect x="24" y="138" width="300" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" />
  <text x="38" y="154" class="s">…factors behind decreases in revenue?</text>
  <rect x="24" y="168" width="300" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" />
  <text x="38" y="184" class="s">What were the sources of revenue?</text>
  <rect x="24" y="198" width="300" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" />
  <text x="38" y="214" class="s">How were sales split across product lines?</text>
  <rect x="24" y="228" width="300" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" />
  <text x="38" y="244" class="s">Were there any changes in pricing strategy?</text>
  <rect x="24" y="258" width="300" height="24" rx="12" fill="#ffedd5" stroke="#ea580c" />
  <text x="38" y="274" class="s">Did the company gain new customers?</text>
  <text x="24" y="310" class="mut">All 6 go to Chroma in one call, 5 results each,</text>
  <text x="24" y="326" class="mut">then duplicates are removed.</text>
