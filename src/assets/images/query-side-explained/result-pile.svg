<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="t">
<title id="t">The catch with asking several questions. The original question and five AI-written variations each get five results, up to 30 chunks instead of 5. Some answer a neighboring question rather than yours, like "decreases in revenue". A reranker scores every chunk against the original question, and only the top 5 go to the AI.</title>
