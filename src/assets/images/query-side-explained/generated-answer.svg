  <title id="t">Expansion with a generated answer. The question “Was there significant turnover in the executive team?” goes to an AI, which writes a pretend answer saying the core executive team remained unchanged. The question and pretend answer are glued together and used as the new search text. On the map, the glued search point moves away from the plain question and into a group of chunks about leadership and the board.</title>
