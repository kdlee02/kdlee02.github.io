<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t">
<title id="t">The bug only the result could reveal. The first query summed qty_delta times unit_price per color and sorted from biggest to smallest. Sales are stored as negative numbers, so it returned the lowest seller: blue, minus 190,571.46. A reviewer that saw only the question, the query and the column list said the query fully answers the question. The same reviewer, also given the result row, noticed the total was negative and suggested ABS. The fixed query answered white, 358,315.09.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="798" height="328" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="20" y="46" width="280" height="80" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="160" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">First query</text><text x="160" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">SUM(qty_delta * unit_price)</text><text x="160" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">ORDER BY total_sales DESC</text><path d="M300 86L338 86" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="340" y="61" width="230" height="50" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="455" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">blue, −190,571.46</text><text x="590" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">sales are stored as negative,</text><text x="590" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">so this is the lowest seller</text><text x="20" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">Review with only the query</text><rect x="20" y="168" width="280" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="160" y="191.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">Reviewer sees: question,</text><text x="160" y="210.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">query, column list</text><path d="M300 196L338 196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="340" y="168" width="230" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="455" y="191.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">gpt-4.1</text><text x="455" y="210.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">"fully answers the question"</text><path d="M570 196L598 196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="600" y="168" width="180" height="56" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="690" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">Bug missed</text><text x="20" y="254" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">Review with the result too</text><rect x="20" y="262" width="280" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="160" y="285.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">… plus the result row</text><text x="160" y="304.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">blue, −190,571.46</text><path d="M300 290L338 290" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="340" y="262" width="230" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="455" y="285.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">gpt-4.1</text><text x="455" y="304.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">"negative total → use ABS"</text><path d="M570 290L598 290" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="600" y="262" width="180" height="56" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="690" y="285.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Fixed query</text><text x="690" y="304.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">white, 358,315.09</text>
</svg>
