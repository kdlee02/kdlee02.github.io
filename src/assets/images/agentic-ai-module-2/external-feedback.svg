<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="t">
  <title id="t">The AI writes code v1. A tool runs the code and gets an error message, which is a new fact the AI did not have. The AI reviews the code together with the error and writes v2.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #991b1b; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="218" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="16" y="50" width="112" height="56" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="72" y="74" text-anchor="middle" class="b">Request</text>
  <text x="72" y="93" text-anchor="middle" class="mut">“code for task X”</text>
  <line x1="130" y1="78" x2="141" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="146" y="50" width="112" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="202" y="74" text-anchor="middle" class="b">AI</text>
  <text x="202" y="93" text-anchor="middle" class="mut">writes code v1</text>
  <line x1="260" y1="78" x2="271" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="276" y="50" width="112" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="332" y="74" text-anchor="middle" class="b">Run the code</text>
  <text x="332" y="93" text-anchor="middle" class="mut">tool</text>
  <line x1="390" y1="78" x2="401" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="406" y="50" width="112" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" />
  <text x="462" y="74" text-anchor="middle" class="b">Error message</text>
  <text x="462" y="93" text-anchor="middle" class="mut">a new fact</text>
  <line x1="520" y1="78" x2="531" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="536" y="50" width="112" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="592" y="74" text-anchor="middle" class="b">AI reviewer</text>
  <text x="592" y="93" text-anchor="middle" class="mut">code + error</text>
  <line x1="650" y1="78" x2="661" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="666" y="50" width="112" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="722" y="74" text-anchor="middle" class="b">Code v2</text>
  <text x="722" y="93" text-anchor="middle" class="mut">fixed</text>

  <line x1="462" y1="108" x2="462" y2="130" stroke="#dc2626" stroke-width="1.5" />
  <rect x="320" y="130" width="284" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" />
  <text x="462" y="150" text-anchor="middle" class="mono">SyntaxError: unterminated string literal</text>

  <text x="400" y="196" text-anchor="middle" class="mut">The reviewer now knows something the writer didn’t: what actually happened when the code ran.</text>
</svg>
