<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t">
  <title id="t">The route() flow. choose_tier() reads the prompt and picks the cheap or premium list. route() takes the next model in that list and calls it. If the call raises an error, it records the error and moves to the next model in the same list. If the answer fails the required-terms check, the call has still been paid for, and it moves to the next model. If the answer passes, route() returns it and no later model is called. If the list runs out, it raises RuntimeError. A request never changes tier: premium errors stay premium, and in this lesson cheap failures never move up to premium.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .lab { fill: #334155; font-size: 12px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #1e293b; }
    .ln { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="818" height="498" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="60" y="20" width="250" height="44" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="185" y="47" text-anchor="middle" class="mono">choose_tier(prompt)</text>
  <line x1="185" y1="64" x2="185" y2="92" class="ln" marker-end="url(#a)" />

  <rect x="60" y="94" width="250" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="185" y="121" text-anchor="middle">next model in FALLBACKS[tier]</text>
  <line x1="185" y1="138" x2="185" y2="166" class="ln" marker-end="url(#a)" />

  <rect x="60" y="168" width="250" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="185" y="195" text-anchor="middle" class="mono">PROVIDERS[provider](...)</text>
  <line x1="185" y1="212" x2="185" y2="260" class="ln" marker-end="url(#a)" />
  <text x="195" y="240" class="lab">answered</text>

  <rect x="60" y="262" width="250" height="44" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="185" y="289" text-anchor="middle" class="mono">passes_quality_check?</text>
  <line x1="185" y1="306" x2="185" y2="354" class="ln" marker-end="url(#a)" />
  <text x="195" y="334" class="lab">pass</text>

  <rect x="60" y="356" width="250" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="185" y="377" text-anchor="middle">return the answer</text>
  <text x="185" y="393" text-anchor="middle" class="mut">later models are never called</text>

  <!-- error branch -->
  <line x1="310" y1="190" x2="398" y2="190" class="ln" marker-end="url(#a)" />
  <text x="354" y="181" text-anchor="middle" class="lab">error</text>
  <rect x="400" y="168" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="510" y="186" text-anchor="middle">save last_error</text>
  <text x="510" y="203" text-anchor="middle" class="mut">provider down or rate-limited</text>

  <!-- quality fail -->
  <line x1="310" y1="284" x2="398" y2="284" class="ln" marker-end="url(#a)" />
  <text x="354" y="275" text-anchor="middle" class="lab">fail</text>
  <rect x="400" y="262" width="220" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="510" y="280" text-anchor="middle">answer rejected</text>
  <text x="510" y="297" text-anchor="middle" class="mut">but the call is already paid</text>

  <!-- loop back -->
  <polyline points="620,190 680,190" class="ln" />
  <polyline points="620,284 680,284 680,116 312,116" class="ln" marker-end="url(#a)" />
  <text x="690" y="200" class="mut">try the next</text>
  <text x="690" y="216" class="mut">model, same tier</text>

  <!-- list empty -->
  <polyline points="60,116 30,116 30,454 58,454" class="ln" marker-end="url(#a)" />
  <text x="40" y="430" class="lab">list empty</text>
  <rect x="60" y="432" width="250" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="185" y="459" text-anchor="middle" class="mono">raise RuntimeError</text>

  <rect x="380" y="340" width="420" height="136" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="396" y="364" class="h">The tier never changes</text>
  <text x="396" y="388">A premium request whose provider is down</text>
  <text x="396" y="406">moves to the next premium model, never a cheap one.</text>
  <text x="396" y="432">The flip side: a cheap request whose answers all</text>
  <text x="396" y="450">fail the check never moves up to premium.</text>
  <text x="396" y="468" class="mut">Part 4 adds that retry.</text>
</svg>
