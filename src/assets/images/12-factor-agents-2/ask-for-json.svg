<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t">
<title id="t">Asking for JSON in the prompt. The same prompt can get two kinds of reply. Usually the model returns plain JSON, {"answer": "42"}, and json.loads works. Sometimes it adds "Sure! Here's your answer:" before the JSON, and json.loads raises JSONDecodeError, so the code needs a fallback.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="258" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Asking for JSON works most of the time</text><rect x="20" y="100" width="170" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="105" y="125.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Prompt</text><text x="105" y="144.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">"only answer in JSON"</text><path d="M190 130L218 130" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="220" y="100" width="100" height="60" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="270" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model</text><path d="M320 130L345 130L345 78L368 78" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M320 130L345 130L345 182L368 182" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="370" y="50" width="200" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="470" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">{"answer": "42"}</text><rect x="370" y="154" width="200" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="470" y="177.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">Sure! Here's your answer:</text><text x="470" y="196.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">{"answer": "42"}</text><path d="M570 78L598 78" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M570 182L598 182" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="600" y="50" width="140" height="56" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="670" y="73.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">json.loads</text><text x="670" y="92.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">works</text><rect x="600" y="154" width="140" height="56" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="670" y="177.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">JSONDecodeError</text><text x="670" y="196.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">→ fallback</text><text x="380" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">A prompt is a request, so the code needs a <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">try</tspan>/<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">except</tspan></text>
</svg>
