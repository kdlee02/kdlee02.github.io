<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t">
  <title id="t">Two ways to get structured output. Left, asking in the prompt: the system prompt describes the JSON, the model replies with text, and json.loads either succeeds or raises JSONDecodeError, so the code needs a fallback. Right, a strict tool: the schema goes in the tools parameter with strict set to true and tool_choice set to required, the API makes the model return a function_call whose arguments match the schema, and the code can read args["answer"] directly.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .mut { fill: #64748b; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; }
  </style>
  <rect x="1" y="1" width="818" height="418" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- left panel -->
  <rect x="14" y="14" width="390" height="392" rx="10" fill="#f8fafc" />
  <text x="209" y="42" text-anchor="middle" class="h">Asking in the prompt</text>
  <text x="209" y="62" text-anchor="middle" class="mut">best-effort: usually works</text>

  <rect x="54" y="80" width="310" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="209" y="107" text-anchor="middle">System prompt describes the JSON</text>
  <line x1="209" y1="124" x2="209" y2="146" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="54" y="148" width="310" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="209" y="175" text-anchor="middle">Model replies with plain text</text>
  <line x1="209" y1="192" x2="209" y2="214" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="54" y="216" width="310" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="209" y="243" text-anchor="middle" class="mono">json.loads(text)</text>

  <line x1="150" y1="260" x2="120" y2="296" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <line x1="268" y1="260" x2="298" y2="296" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="30" y="298" width="170" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="115" y="323" text-anchor="middle">Valid JSON</text>
  <text x="115" y="343" text-anchor="middle" class="mut">read result["answer"]</text>
  <rect x="218" y="298" width="170" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" />
  <text x="303" y="323" text-anchor="middle" class="mono">JSONDecodeError</text>
  <text x="303" y="343" text-anchor="middle" class="mut">log, retry, or escalate</text>
  <text x="209" y="388" text-anchor="middle" class="mut">Your code must handle both branches.</text>

  <!-- right panel -->
  <rect x="416" y="14" width="390" height="392" rx="10" fill="#f8fafc" />
  <text x="611" y="42" text-anchor="middle" class="h">A strict tool</text>
  <text x="611" y="62" text-anchor="middle" class="mut">enforced by the API</text>

  <rect x="456" y="80" width="310" height="62" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="611" y="105" text-anchor="middle">Schema passed in tools=</text>
  <text x="611" y="126" text-anchor="middle" class="mono">"strict": True</text>
  <line x1="611" y1="142" x2="611" y2="164" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="456" y="166" width="310" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="611" y="193" text-anchor="middle" class="mono">tool_choice="required"</text>
  <line x1="611" y1="210" x2="611" y2="232" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="456" y="234" width="310" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="611" y="259" text-anchor="middle">Model must return a function_call</text>
  <text x="611" y="280" text-anchor="middle" class="mut">arguments match the schema</text>
  <line x1="611" y1="296" x2="611" y2="318" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="456" y="320" width="310" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="611" y="347" text-anchor="middle" class="mono">args["answer"] is always there</text>
  <text x="611" y="388" text-anchor="middle" class="mut">The system prompt no longer describes the format.</text>
</svg>
