<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="t">
  <title id="t">How the context list grows. Before the first call it holds one item, the user's message "Compute 15 + 27". The model replies with a function_call for add with a equal to 15 and b equal to 27. Your code runs add, gets 42, and appends two items: the function_call and a function_call_output with result 42, both carrying the same call_id. The second call sends all three items, and the model replies with final_answer "42".</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #1e293b; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #b45309; font-weight: 700; }
  </style>
  <rect x="1" y="1" width="818" height="438" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- call 1 -->
  <text x="30" y="38" class="h">1st call</text>
  <rect x="30" y="52" width="330" height="96" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4" />
  <text x="44" y="72" class="mut">context (1 item)</text>
  <rect x="44" y="82" width="302" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="56" y="102" class="mono">user: "Compute 15 + 27"</text>

  <line x1="360" y1="100" x2="438" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="440" y="78" width="90" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="485" y="105" text-anchor="middle" class="h">Model</text>
  <line x1="530" y1="100" x2="578" y2="100" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="580" y="78" width="214" height="44" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="687" y="98" text-anchor="middle" class="mono">function_call</text>
  <text x="687" y="114" text-anchor="middle" class="mono">add(a=15, b=27)</text>

  <!-- your code -->
  <line x1="687" y1="122" x2="687" y2="168" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="470" y="170" width="324" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="632" y="192" text-anchor="middle">Your code runs add(15, 27) → 42</text>
  <text x="632" y="211" text-anchor="middle" class="mut">and appends two items to the list</text>
  <polyline points="470,196 300,196 300,264" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />

  <!-- call 2 -->
  <text x="30" y="254" class="h">2nd call</text>
  <rect x="30" y="266" width="330" height="160" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4" />
  <text x="44" y="286" class="mut">context (3 items)</text>
  <rect x="44" y="296" width="302" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="56" y="316" class="mono">user: "Compute 15 + 27"</text>
  <rect x="44" y="334" width="302" height="38" rx="6" fill="#fef3c7" stroke="#d97706" />
  <text x="56" y="351" class="mono">function_call  add(a=15, b=27)</text>
  <text x="56" y="366" class="tag">call_id: call_lUnR…</text>
  <rect x="44" y="380" width="302" height="38" rx="6" fill="#e0f2fe" stroke="#0284c7" />
  <text x="56" y="397" class="mono">function_call_output  {"result": 42}</text>
  <text x="56" y="412" class="tag">call_id: call_lUnR…</text>

  <line x1="360" y1="346" x2="438" y2="346" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="440" y="324" width="90" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="485" y="351" text-anchor="middle" class="h">Model</text>
  <line x1="530" y1="346" x2="578" y2="346" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <rect x="580" y="324" width="214" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="687" y="344" text-anchor="middle" class="mono">function_call</text>
  <text x="687" y="360" text-anchor="middle" class="mono">final_answer("42")</text>

  <text x="587" y="402" text-anchor="middle" class="mut">Matching call_id pairs each request with its result.</text>
</svg>
