<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="t">
  <title id="t">The agent loop. Start with the context holding the user's message and set step to 0 and done to false. While not done and step is below max_steps: add one to step, call the model with the context, and for each function call record it, run the tool inside try/except, and record the result or the error. If the tool was final_answer, set done to true. When the loop ends, report the answer, or report that the step limit was reached. Beside it, the run for "15 + 27, then times 3": step 1 add gives 42, step 2 multiply gives 126, step 3 final_answer "126".</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .lab { fill: #334155; font-size: 12px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; }
  </style>
  <rect x="1" y="1" width="818" height="458" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- flow -->
  <rect x="60" y="20" width="340" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="230" y="41" text-anchor="middle" class="mono">context = [user message]</text>
  <text x="230" y="59" text-anchor="middle" class="mono">step = 0, done = False</text>
  <line x1="230" y1="70" x2="230" y2="90" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />

  <rect x="60" y="92" width="340" height="44" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="230" y="119" text-anchor="middle" class="mono">not done and step &lt; max_steps ?</text>

  <line x1="230" y1="136" x2="230" y2="158" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <text x="240" y="152" class="lab">yes</text>

  <rect x="60" y="160" width="340" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="230" y="187" text-anchor="middle">step += 1, call the model with context</text>
  <line x1="230" y1="204" x2="230" y2="224" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />

  <rect x="60" y="226" width="340" height="76" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="230" y="248" text-anchor="middle" class="h">For each function_call:</text>
  <text x="230" y="268" text-anchor="middle">record it, run the tool in try/except,</text>
  <text x="230" y="288" text-anchor="middle">record the result or {"error": ...}</text>
  <line x1="230" y1="302" x2="230" y2="322" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />

  <rect x="60" y="324" width="340" height="44" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="230" y="351" text-anchor="middle">If it was final_answer: done = True</text>

  <polyline points="60,346 34,346 34,114 58,114" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />

  <polyline points="400,114 436,114 436,414 402,414" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" />
  <text x="412" y="106" class="lab">no</text>

  <rect x="60" y="392" width="340" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="230" y="419" text-anchor="middle">Report the answer, or that the limit was hit</text>

  <!-- trace -->
  <rect x="470" y="20" width="336" height="416" rx="10" fill="#f8fafc" />
  <text x="638" y="46" text-anchor="middle" class="h">"15 + 27, then × 3"</text>

  <rect x="490" y="64" width="296" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="504" y="86" class="lab">Step 1</text>
  <text x="504" y="108" class="mono">add(a=15, b=27)</text>
  <text x="504" y="125" class="mut">result 42 goes into the context</text>

  <rect x="490" y="148" width="296" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="504" y="170" class="lab">Step 2</text>
  <text x="504" y="192" class="mono">multiply(a=42, b=3)</text>
  <text x="504" y="209" class="mut">42 was read from the context; result 126</text>

  <rect x="490" y="232" width="296" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="504" y="254" class="lab">Step 3</text>
  <text x="504" y="276" class="mono">final_answer(answer="126")</text>
  <text x="504" y="293" class="mut">done = True, the loop ends</text>

  <text x="638" y="340" text-anchor="middle" class="mono">Completed in 3 steps</text>
  <text x="638" y="362" text-anchor="middle" class="mono">Final answer: 126</text>
  <text x="638" y="400" text-anchor="middle" class="mut">max_steps = 5, so 2 steps were left over</text>
</svg>
