<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="t">
<title id="t">The model asks, your code acts. The model writes a request: name add, arguments a 15 and b 27. Your code matches on the name. add runs add(a=15, b=27) and gets 42. multiply runs multiply. Any other name falls through to the last case and becomes an error string, so a made-up tool cannot crash the program.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="278" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">The model writes a request; your code decides what runs</text><rect x="20" y="100" width="110" height="64" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="75" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model</text><path d="M130 132L158 132" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="160" y="92" width="230" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="275" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Request</text><text x="275" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">name: add</text><text x="275" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">arguments: {a: 15, b: 27}</text><path d="M390 132L418 132" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="420" y="102" width="120" height="60" rx="10" fill="#fff7e6" stroke="#b45309" stroke-width="1.5"/><text x="480" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle">match name</text><path d="M540 132L578 64" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M540 132L578 132" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M540 132L578 200" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="580" y="36" width="160" height="56" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="660" y="59.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">add</text><text x="660" y="78.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">add(15, 27) → 42</text><rect x="580" y="104" width="160" height="56" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="660" y="127.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="middle">multiply</text><text x="660" y="146.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="middle">multiply(…)</text><rect x="580" y="172" width="160" height="56" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="660" y="195.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">any other name</text><text x="660" y="214.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">→ error string</text><text x="380" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">A made-up tool name can't crash the program: it falls through to the last case</text>
</svg>
