<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t">
<title id="t">Without error handling, the model asks for a divide tool that does not exist, the lookup raises an exception, and the program crashes mid-task. With try/except, the exception is caught and added to the context as {"error": "Tool divide not found"}. On the next step the model reads it and tries something else.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text x="20" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">A failed tool becomes something the model can read</text><text x="20" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">Without</text><rect x="100" y="56" width="150" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="175" y="79.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model asks</text><text x="175" y="98.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">for <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">divide</tspan></text><path d="M250 84L283 84" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="285" y="56" width="170" height="56" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5"/><text x="370" y="79.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">No such tool:</text><text x="370" y="98.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">exception raised</text><path d="M455 84L488 84" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="490" y="56" width="250" height="56" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="615" y="79.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#7f1d1d" text-anchor="middle">Program crashes,</text><text x="615" y="98.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the task stops</text><text x="20" y="193" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="start">With</text><rect x="100" y="160" width="150" height="56" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="175" y="183.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Model asks</text><text x="175" y="202.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">for <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">divide</tspan></text><path d="M250 188L283 188" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="285" y="160" width="170" height="56" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="370" y="193" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14532d" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">except</tspan> catches it</text><path d="M455 188L488 188" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="490" y="160" width="250" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="615" y="183.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="650" fill="#0f172a" text-anchor="middle">Added to the context</text><text x="615" y="202.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#0f172a" text-anchor="middle">{"error": "Tool divide not found"}</text><path d="M615 216Q395 278 175 218" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="395" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">next step: the model reads it and tries again</text>
</svg>
