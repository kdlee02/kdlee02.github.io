<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="t">
  <title id="t">Two different caches. On the left, the application response cache: before any call, the app looks up the model and prompt; on a hit it returns the stored answer and no request reaches the provider, so the call costs nothing. On the right, provider prompt caching: the request always goes to the provider and the model always writes a fresh answer, but if the start of the prompt matches a saved prefix, those input tokens are billed at a tenth of the normal rate. The first skips the request; the second discounts part of it.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .sm { font-size: 12px; }
    .lab { fill: #334155; font-size: 12px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #1e293b; }
    .wht { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #ffffff; }
    .ln { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="818" height="398" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- left -->
  <rect x="16" y="16" width="384" height="368" rx="10" fill="#f8fafc" />
  <text x="208" y="42" text-anchor="middle" class="h">Application response cache</text>
  <text x="208" y="60" text-anchor="middle" class="mut">in your code; stores finished answers</text>
  <rect x="68" y="76" width="280" height="40" rx="8" fill="#e2e8f0" stroke="#64748b" />
  <text x="208" y="101" text-anchor="middle">same model + exact prompt seen?</text>
  <line x1="150" y1="116" x2="104" y2="160" class="ln" marker-end="url(#a)" />
  <text x="112" y="140" text-anchor="end" class="lab">hit</text>
  <line x1="266" y1="116" x2="312" y2="160" class="ln" marker-end="url(#a)" />
  <text x="304" y="140" class="lab">miss</text>
  <rect x="30" y="162" width="160" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="110" y="186" text-anchor="middle">return stored answer</text>
  <text x="110" y="206" text-anchor="middle" class="mono">$0.000000</text>
  <text x="110" y="223" text-anchor="middle" class="mut">no request sent</text>
  <rect x="226" y="162" width="160" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="306" y="186" text-anchor="middle">call the provider,</text>
  <text x="306" y="204" text-anchor="middle">store answer + cost</text>
  <text x="306" y="223" text-anchor="middle" class="mut">pay full price once</text>
  <text x="208" y="270" text-anchor="middle" class="h">Lesson run: 5 requests</text>
  <text x="208" y="292" text-anchor="middle" class="mono">2 calls made, 3 avoided</text>
  <text x="208" y="312" text-anchor="middle" class="mono">spend $0.001351</text>
  <text x="208" y="332" text-anchor="middle" class="mono">avoided ≈ $0.002575</text>
  <text x="208" y="364" text-anchor="middle" class="mut">Skips the whole request.</text>

  <!-- right -->
  <rect x="420" y="16" width="384" height="368" rx="10" fill="#f8fafc" />
  <text x="612" y="42" text-anchor="middle" class="h">Provider prompt caching</text>
  <text x="612" y="60" text-anchor="middle" class="mut">at the provider; stores the processed prompt start</text>
  <text x="440" y="96" class="lab">every request is sent:</text>
  <rect x="440" y="106" width="270" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" />
  <text x="575" y="124" text-anchor="middle" class="sm">stable prefix (policy)</text>
  <text x="575" y="139" text-anchor="middle" class="mut">read from cache at 0.1×</text>
  <rect x="712" y="106" width="76" height="40" rx="6" fill="#fef3c7" stroke="#d97706" />
  <text x="750" y="124" text-anchor="middle" class="sm">question</text>
  <text x="750" y="139" text-anchor="middle" class="mut">1×</text>
  <line x1="612" y1="148" x2="612" y2="180" class="ln" marker-end="url(#a)" />
  <rect x="512" y="182" width="200" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="612" y="203" text-anchor="middle">model writes a</text>
  <text x="612" y="221" text-anchor="middle">fresh answer</text>
  <text x="612" y="270" text-anchor="middle" class="h">First request writes the prefix</text>
  <text x="612" y="292" text-anchor="middle" class="sm">at 1.25×; later ones read it at 0.1×.</text>
  <text x="612" y="312" text-anchor="middle" class="sm">Output is billed in full every time.</text>
  <text x="612" y="364" text-anchor="middle" class="mut">Discounts part of the request.</text>
</svg>
