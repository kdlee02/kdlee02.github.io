<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="t">
  <title id="t">Trimming a seven-message conversation to a 50-token budget. The messages are scanned from newest to oldest. The newest message, the question about what to measure before adding an index, is kept first, then recent messages are added while they fit. A message that would push the total over 50 tokens is skipped, and the scan keeps going in case an older, shorter message still fits. The kept messages are then put back in time order and sent after the system instruction, which sits outside the budget. Result: 83 tokens of history trimmed to 48, with 4 of 7 messages kept and 35 tokens saved.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .sm { font-size: 12px; }
    .lab { fill: #334155; font-size: 12px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #1e293b; }
    .wht { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #ffffff; }
    .ln { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="818" height="448" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <text x="190" y="34" text-anchor="middle" class="h">Conversation history (oldest at top)</text>
  <text x="190" y="52" text-anchor="middle" class="mut">which messages fit is illustrative</text>

  <rect x="50" y="66" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3" />
  <text x="62" y="86" class="sm">user: setting up PostgreSQL</text><text x="320" y="86" text-anchor="end" class="mut">skipped</text>
  <rect x="50" y="104" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3" />
  <text x="62" y="124" class="sm">assistant: setup advice</text><text x="320" y="124" text-anchor="end" class="mut">skipped</text>
  <rect x="50" y="142" width="280" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="62" y="162" class="sm">user: filtering on two columns</text><text x="320" y="162" text-anchor="end" class="lab">kept</text>
  <rect x="50" y="180" width="280" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3" />
  <text x="62" y="200" class="sm">assistant: long index answer</text><text x="320" y="200" text-anchor="end" class="mut">too big</text>
  <rect x="50" y="218" width="280" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="62" y="238" class="sm">user: the table gets many writes</text><text x="320" y="238" text-anchor="end" class="lab">kept</text>
  <rect x="50" y="256" width="280" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="62" y="276" class="sm">assistant: indexes slow writes</text><text x="320" y="276" text-anchor="end" class="lab">kept</text>
  <rect x="50" y="294" width="280" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="62" y="314" class="sm">user: what should I measure?</text><text x="320" y="314" text-anchor="end" class="lab">kept 1st</text>

  <line x1="30" y1="320" x2="30" y2="72" class="ln" marker-end="url(#a)" />
  <text x="22" y="200" text-anchor="middle" class="mut" transform="rotate(-90 22 200)">scan newest → oldest</text>

  <text x="190" y="350" class="mut" text-anchor="middle">A message that doesn't fit is skipped,</text>
  <text x="190" y="366" class="mut" text-anchor="middle">and the scan keeps looking at older ones.</text>

  <line x1="340" y1="200" x2="418" y2="200" class="ln" marker-end="url(#a)" />
  <text x="379" y="190" text-anchor="middle" class="mut">reorder</text>

  <text x="610" y="34" text-anchor="middle" class="h">Sent to the model (time order)</text>
  <rect x="420" y="66" width="380" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" />
  <text x="432" y="85" class="sm">system: concise support assistant</text>
  <text x="432" y="100" class="mut">outside the budget, still billed</text>
  <rect x="420" y="124" width="380" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="432" y="144" class="sm">user: filtering on two columns</text>
  <rect x="420" y="160" width="380" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="432" y="180" class="sm">user: the table gets many writes</text>
  <rect x="420" y="196" width="380" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="432" y="216" class="sm">assistant: indexes slow writes</text>
  <rect x="420" y="232" width="380" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" />
  <text x="432" y="252" class="sm">user: what should I measure?</text>

  <rect x="420" y="286" width="380" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="436" y="310" class="mono">Full history:    83 tokens</text>
  <text x="436" y="330" class="mono">Trimmed history: 48 tokens  (budget 50)</text>
  <text x="436" y="350" class="mono">Messages kept:   4 of 7</text>
  <text x="436" y="370" class="mono">Tokens saved:    35 on this turn</text>

  <text x="410" y="420" text-anchor="middle" class="mut">Note the flaw the lesson admits: a kept message can lose the message it was replying to.</text>
</svg>
