<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t">
  <title id="t">Where the breakpoint sits changes the bill. Top row, implicit mode: the request is one block, policy then question, and the breakpoint falls after the question, so each request writes all of its roughly 5,779 tokens and none are read. Bottom row, explicit mode: the policy and question are separate blocks with the breakpoint after the policy, so request 1 writes 5,765 tokens and requests 2 and 3 read them, with only the 14-token question billed at the normal rate. On the right, the cost of the three requests in units of the normal input price: implicit 21,672.5, no caching 17,338, explicit 8,402.25.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 14px; }
    .mut { fill: #64748b; font-size: 12px; }
    .sm { font-size: 12px; }
    .lab { fill: #334155; font-size: 12px; font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #1e293b; }
    .wht { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #ffffff; }
    .ln { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="818" height="428" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- implicit -->
  <text x="30" y="38" class="h">Implicit (default): breakpoint after the question</text>
  <rect x="30" y="52" width="330" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" />
  <text x="195" y="77" text-anchor="middle" class="sm">policy, about 5,765 tokens</text>
  <rect x="360" y="52" width="90" height="40" rx="6" fill="#fef3c7" stroke="#d97706" />
  <text x="405" y="77" text-anchor="middle" class="sm">question</text>
  <line x1="454" y1="44" x2="454" y2="100" stroke="#dc2626" stroke-width="3" />
  <text x="368" y="112" class="lab" style="fill:#dc2626">saved up to here</text>
  <text x="30" y="118" class="mono">req 1  write 5779  read    0</text>
  <text x="30" y="136" class="mono">req 2  write 5779  read    0</text>
  <text x="30" y="154" class="mono">req 3  write 5780  read    0</text>
  <text x="270" y="136" class="mut">each new question breaks the match,</text>
  <text x="270" y="152" class="mut">so every request pays the write premium</text>

  <line x1="30" y1="182" x2="520" y2="182" stroke="#e2e8f0" />

  <!-- explicit -->
  <text x="30" y="214" class="h">Explicit: breakpoint after the policy</text>
  <rect x="30" y="228" width="330" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" />
  <text x="195" y="253" text-anchor="middle" class="sm">policy, about 5,765 tokens</text>
  <line x1="364" y1="220" x2="364" y2="276" stroke="#16a34a" stroke-width="3" />
  <rect x="368" y="228" width="90" height="40" rx="6" fill="#fef3c7" stroke="#d97706" />
  <text x="413" y="253" text-anchor="middle" class="sm">question</text>
  <text x="372" y="292" class="lab" style="fill:#15803d">saved up to here</text>
  <text x="30" y="312" class="mono">req 1  write 5765  read    0  ordinary 14</text>
  <text x="30" y="330" class="mono">req 2  write    0  read 5765  ordinary 14</text>
  <text x="30" y="348" class="mono">req 3  write    0  read 5765  ordinary 15</text>
  <text x="30" y="380" class="mut">Blocks not to scale. The model still receives the full policy and</text>
  <text x="30" y="396" class="mut">a new question each time; only the billing category changes.</text>

  <!-- cost bars -->
  <rect x="540" y="20" width="264" height="390" rx="10" fill="#f8fafc" />
  <text x="672" y="46" text-anchor="middle" class="h">Cost of 3 requests</text>
  <text x="672" y="64" text-anchor="middle" class="mut">units of the normal input price</text>
  <line x1="560" y1="350" x2="784" y2="350" stroke="#94a3b8" />
  <rect x="570" y="110" width="56" height="240" fill="#dc2626" />
  <text x="598" y="102" text-anchor="middle" class="mono">21,672.5</text>
  <text x="598" y="370" text-anchor="middle" class="sm">implicit</text>
  <rect x="644" y="158" width="56" height="192" fill="#94a3b8" />
  <text x="672" y="150" text-anchor="middle" class="mono">17,338</text>
  <text x="672" y="370" text-anchor="middle" class="sm">no cache</text>
  <rect x="718" y="257" width="56" height="93" fill="#16a34a" />
  <text x="746" y="249" text-anchor="middle" class="mono">8,402</text>
  <text x="746" y="370" text-anchor="middle" class="sm">explicit</text>
  <text x="672" y="396" text-anchor="middle" class="mut">write 1.25×, read 0.1×</text>
</svg>
