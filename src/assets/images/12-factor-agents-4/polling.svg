<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" role="img" aria-labelledby="t">
<title id="t">Start now, check back later. The client sends POST /agent/launch. The server starts the agent in the background and immediately returns the run ID. The agent works through its steps. Meanwhile the client sends GET /agent/state/{id} once a second: the first answers say running, and the last says complete after 8 steps.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="758" height="314" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="80" y="40" width="140" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="150" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Client</text><rect x="310" y="40" width="160" height="40" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="390" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Server</text><rect x="550" y="40" width="180" height="40" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="640" y="65" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Agent, in background</text><path d="M150 80V304" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M390 80V304" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M640 80V304" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="632" y="128" width="16" height="152" rx="4" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="656" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="start">steps 1 … 8</text><path d="M150 108L388 108" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="269" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">POST /agent/launch</tspan></text><path d="M390 128L630 128" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="510" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">start</text><path d="M390 152L152 152" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="271" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">run id, right away</text><path d="M150 186L388 186" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="269" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">GET /agent/state/{id}</tspan></text><path d="M390 216L152 216" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="271" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">"running"</text><text x="20" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">once a</text><text x="20" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">second…</text><path d="M150 256L388 256" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="269" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" tex