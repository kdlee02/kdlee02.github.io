<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" role="img" aria-labelledby="t">
<title id="t">Any client works. The test script and a web page for a garden-planning demo both use the same five endpoints: launch, state, pause, resume and provide_input. A Slack bot would just be another client; the course does not build one. Behind the endpoints the agent core is unchanged. No server code changed for the web page.</title>
