<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="t">
  <title id="t">One request asks for a QR code and a weather note. The AI made four tool calls in this order: get the weather (59.6 degrees now, high 65.2, low 49.0), get the current time (06:20:39), generate the QR code (deeplearning_qr.png), and write the text file (weather_note.txt), which included the time.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #166534; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="288" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="20" y="20" width="740" height="56" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="390" y="43" text-anchor="middle">“Can you help me create a QR code that goes to www.deeplearning.com from the image</text>
  <text x="390" y="62" text-anchor="middle">dl_logo.jpg? Also write me a txt note with the current weather please.”</text>

  <line x1="390" y1="78" x2="390" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <g>
    <rect x="20" y="105" width="165" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
    <text x="102" y="128" text-anchor="middle" class="b">1. Weather</text>
    <text x="102" y="147" text-anchor="middle" class="mono">get_weather_from_ip</text>
    <text x="102" y="183" text-anchor="middle" class="mut">59.6°F now</text>
    <text x="102" y="200" text-anchor="middle" class="mut">high 65.2, low 49.0</text>
  </g>
  <line x1="187" y1="133" x2="205" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <g>
    <rect x="210" y="105" width="165" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
    <text x="292" y="128" text-anchor="middle" class="b">2. Time</text>
    <text x="292" y="147" text-anchor="middle" class="mono">get_current_time</text>
    <text x="292" y="183" text-anchor="middle" class="mut">06:20:39</text>
    <text x="292" y="200" text-anchor="middle" class="mut" style="fill:#b45309">not asked for</text>
  </g>
  <line x1="377" y1="133" x2="395" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <g>
    <rect x="400" y="105" width="165" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
    <text x="482" y="128" text-anchor="middle" class="b">3. QR code</text>
    <text x="482" y="147" text-anchor="middle" class="mono">generate_qr_code</text>
    <text x="482" y="183" text-anchor="middle" class="mut">deeplearning_qr.png</text>
  </g>
  <line x1="567" y1="133" x2="585" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <g>
    <rect x="590" y="105" width="170" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
    <text x="675" y="128" text-anchor="middle" class="b">4. Write the note</text>
    <text x="675" y="147" text-anchor="middle" class="mono">write_txt_file</text>
    <text x="675" y="183" text-anchor="middle" class="mut">weather_note.txt</text>
    <text x="675" y="200" text-anchor="middle" class="mut">“generated at 06:20:39”</text>
  </g>

  <path d="M292 210 V230 H675 V210" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="483" y="248" text-anchor="middle" class="mut">the time ended up as a timestamp in the note</text>

  <text x="390" y="276" text-anchor="middle" class="mut">gpt-5-mini picked these four calls and their order by itself (from my lab run)</text>
</svg>
