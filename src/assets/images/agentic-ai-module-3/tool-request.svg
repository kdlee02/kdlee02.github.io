<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="t">
  <title id="t">Two lanes. In the AI lane, the AI reads the question and the tool descriptions, then writes a request: get_current_time with Pacific/Auckland. In the program lane, your program runs the real function and gets 04:00:00. The result goes back to the AI, which writes the answer: it's 4 AM in Auckland.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #5b21b6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="288" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="12" y="20" width="756" height="100" rx="10" fill="#faf5ff" />
  <rect x="12" y="140" width="756" height="100" rx="10" fill="#f0fdf4" />
  <text x="24" y="74" class="b" style="fill:#6d28d9">AI</text>
  <text x="24" y="186" class="b" style="fill:#15803d">Your</text>
  <text x="24" y="202" class="b" style="fill:#15803d">program</text>

  <rect x="100" y="42" width="170" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="185" y="66" text-anchor="middle" class="b">Reads the question</text>
  <text x="185" y="85" text-anchor="middle" class="mut">+ the tool descriptions</text>
  <line x1="272" y1="70" x2="279" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="284" y="42" width="274" height="56" rx="8" fill="#ffffff" stroke="#7c3aed" />
  <text x="421" y="64" text-anchor="middle" class="b">Writes a request</text>
  <text x="421" y="84" text-anchor="middle" class="mono">get_current_time("Pacific/Auckland")</text>

  <line x1="421" y1="100" x2="421" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="316" y="162" width="210" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="421" y="186" text-anchor="middle" class="b">Runs the real function</text>
  <text x="421" y="205" text-anchor="middle" class="mut">returns "04:00:00"</text>

  <path d="M528 190 H655 V102" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="600" y="182" text-anchor="middle" class="mut">result sent back</text>

  <rect x="572" y="42" width="180" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="662" y="66" text-anchor="middle" class="b">Writes the answer</text>
  <text x="662" y="85" text-anchor="middle" class="mut">“It’s 4 AM in Auckland.”</text>

  <text x="390" y="270" text-anchor="middle" class="mut">The AI never runs anything itself. It writes a request, and your program decides whether to run it.</text>
</svg>
