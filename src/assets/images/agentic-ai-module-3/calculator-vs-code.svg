<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-labelledby="t">
  <title id="t">Left: one tool per calculator button. Add, subtract, multiply and divide exist, but square root, powers, logarithms and more are missing, so every new kind of question needs a new tool. Right: the AI writes two lines of Python, the code runs and prints 1.4142135623730951, and the AI answers that the square root of 2 is about 1.4142.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="268" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <text x="175" y="36" text-anchor="middle" class="b">One tool per button</text>
  <g fill="#dcfce7" stroke="#16a34a">
    <rect x="40" y="56" width="130" height="32" rx="16" /><rect x="180" y="56" width="130" height="32" rx="16" />
    <rect x="40" y="98" width="130" height="32" rx="16" /><rect x="180" y="98" width="130" height="32" rx="16" />
  </g>
  <g fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3">
    <rect x="40" y="140" width="130" height="32" rx="16" /><rect x="180" y="140" width="130" height="32" rx="16" />
    <rect x="40" y="182" width="130" height="32" rx="16" /><rect x="180" y="182" width="130" height="32" rx="16" />
  </g>
  <g text-anchor="middle">
    <text x="105" y="77">add</text><text x="245" y="77">subtract</text>
    <text x="105" y="119">multiply</text><text x="245" y="119">divide</text>
    <text x="105" y="161" style="fill:#b91c1c">square root?</text><text x="245" y="161" style="fill:#b91c1c">powers?</text>
    <text x="105" y="203" style="fill:#b91c1c">logarithms?</text><text x="245" y="203" style="fill:#b91c1c">…and more</text>
  </g>
  <text x="175" y="242" text-anchor="middle" class="mut">every new kind of question needs a new tool</text>

  <line x1="355" y1="24" x2="355" y2="248" stroke="#e2e8f0" stroke-width="2" />

  <text x="570" y="36" text-anchor="middle" class="b">Let the AI write code</text>
  <rect x="400" y="50" width="340" height="32" rx="8" fill="#fef3c7" stroke="#d97706" />
  <text x="570" y="71" text-anchor="middle">“What’s the square root of 2?”</text>
  <line x1="570" y1="83" x2="570" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="400" y="98" width="340" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="418" y="122" class="b">AI writes</text>
  <text x="490" y="122" class="mono" style="fill:#5b21b6">import math; print(math.sqrt(2))</text>
  <line x1="570" y1="139" x2="570" y2="151" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="400" y="154" width="340" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="418" y="178" class="b">Code runs</text>
  <text x="502" y="178" class="mono" style="fill:#166534">1.4142135623730951</text>
  <line x1="570" y1="195" x2="570" y2="207" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <rect x="400" y="210" width="340" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="570" y="233" text-anchor="middle">“The square root of 2 is about 1.4142.”</text>
</svg>
