<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t">
  <title id="t">Left, without a checkpointer: the question "Which of the two is cheaper?" arrives on its own, so the model asks which two items are meant. Right, with InMemorySaver: thread 1 already holds the steak question, the menu search, its result and the answer with both prices, so the follow-up "Which of the two is cheaper?" is answered from the saved history, the Tenderloin Steak Salad at 26,000 won, with no new search. Thread 2 is a separate, empty conversation, so the same follow-up gets "which two do you mean?" again.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .m { font-size: 10.5px; fill: #1e293b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #475569; }
  </style>
  <rect x="1" y="1" width="778" height="358" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <!-- left panel -->
  <rect x="14" y="14" width="232" height="290" rx="10" fill="#f8fafc" />
  <text x="130" y="40" text-anchor="middle" class="b">Without a checkpointer</text>
  <text x="28" y="66" class="mono">invoke (starts empty)</text>
  <rect x="24" y="200" width="214" height="22" rx="5" fill="#dcfce7" stroke="#d97706" stroke-width="2" /><text x="31" y="215" class="m">Human: which of the two is cheaper?</text>
  <rect x="24" y="228" width="214" height="40" rx="5" fill="#ede9fe" stroke="#d97706" stroke-width="2" /><text x="31" y="244" class="m">AI: I'm not sure which two</text><text x="31" y="260" class="m">items you mean.</text>
  <text x="28" y="120" class="mut">No earlier turns:</text>
  <text x="28" y="138" class="mut">"the two" points at nothing.</text>

  <!-- right panel -->
  <rect x="256" y="14" width="510" height="290" rx="10" fill="#f8fafc" />
  <text x="512" y="40" text-anchor="middle" class="b">With InMemorySaver</text>

  <text x="270" y="66" class="mono">thread_id "1"</text>
  <rect x="268" y="76" width="236" height="22" rx="5" fill="#dcfce7" stroke="#16a34a" /><text x="275" y="91" class="m">Human: how much are the steak dishes?</text>
  <rect x="268" y="104" width="236" height="22" rx="5" fill="#ede9fe" stroke="#7c3aed" /><text x="275" y="119" class="m">AI: call search_menu("steak dishes…")</text>
  <rect x="268" y="132" width="236" height="22" rx="5" fill="#f1f5f9" stroke="#94a3b8" /><text x="275" y="147" class="m">Tool: the two steak entries</text>
  <rect x="268" y="160" width="236" height="22" rx="5" fill="#ede9fe" stroke="#7c3aed" /><text x="275" y="175" class="m">AI: Signature ₩35,000, Tenderloin ₩26,000</text>
  <rect x="268" y="200" width="236" height="22" rx="5" fill="#dcfce7" stroke="#d97706" stroke-width="2" /><text x="275" y="215" class="m">Human: which of the two is cheaper?</text>
  <rect x="268" y="228" width="236" height="40" rx="5" fill="#ede9fe" stroke="#d97706" stroke-width="2" /><text x="275" y="244" class="m">AI: the Tenderloin Steak Salad at</text><text x="275" y="260" class="m">₩26,000 (no new search)</text>

  <text x="518" y="66" class="mono">thread_id "2"</text>
  <text x="518" y="120" class="mut">A separate conversation:</text>
  <text x="518" y="138" class="mut">nothing saved here yet.</text>
  <rect x="516" y="200" width="238" height="22" rx="5" fill="#dcfce7" stroke="#d97706" stroke-width="2" /><text x="523" y="215" class="m">Human: which of the two is cheaper?</text>
  <rect x="516" y="228" width="238" height="40" rx="5" fill="#ede9fe" stroke="#d97706" stroke-width="2" /><text x="523" y="244" class="m">AI: I can't tell which two</text><text x="523" y="260" class="m">without the item names.</text>

  <line x1="268" y1="190" x2="754" y2="190" stroke="#cbd5e1" stroke-dasharray="4 3" />
  <text x="512" y="292" text-anchor="middle" class="mut">Orange border = the follow-up question and its answer.</text>

  <text x="390" y="336" text-anchor="middle" class="mut">Each invoke with a thread_id loads that thread's saved messages, adds the new question, and saves again.</text>
</svg>
