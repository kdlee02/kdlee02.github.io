<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t">
  <title id="t">The ReAct loop as a graph. START leads to the agent node, which calls the model. If the model's reply has tool calls, the graph goes to the tools node, a ToolNode that runs every requested tool, and the results come back to the agent as ToolMessages. If the reply has no tool calls, the graph goes to END and the reply is the answer.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .mut { fill: #64748b; font-size: 12px; }
    .b { font-weight: 700; }
    .node { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1e293b; font-weight: 700; }
    .sub { fill: #475569; font-size: 11px; }
    .cond { fill: #b45309; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309" />
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0" />

  <rect x="20" y="120" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="51" y="144" text-anchor="middle" class="b">START</text>
  <line x1="82" y1="140" x2="116" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />

  <rect x="120" y="112" width="170" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" />
  <text x="205" y="136" text-anchor="middle" class="node">agent</text>
  <text x="205" y="154" text-anchor="middle" class="sub">calls the model with tools</text>

  <rect x="470" y="112" width="170" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" />
  <text x="555" y="136" text-anchor="middle" class="node">tools</text>
  <text x="555" y="154" text-anchor="middle" class="sub">ToolNode runs each request</text>

  <line x1="290" y1="126" x2="466" y2="126" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <text x="380" y="100" text-anchor="middle" class="cond">tool_calls not empty: run them</text>

  <line x1="470" y1="154" x2="294" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#a)" />
  <text x="380" y="186" text-anchor="middle" class="mut">results come back as ToolMessages</text>

  <line x1="205" y1="168" x2="205" y2="226" stroke="#b45309" stroke-width="2" marker-end="url(#o)" />
  <rect x="174" y="228" width="62" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="205" y="252" text-anchor="middle" class="b">END</text>
  <text x="217" y="214" class="cond">tool_calls empty: that reply is the answer</text>

  <text x="530" y="246" text-anchor="middle" class="mut">Reason (agent) → act (tool call) →</text>
  <text x="530" y="264" text-anchor="middle" class="mut">observe (ToolMessage) → reason again</text>
</svg>
