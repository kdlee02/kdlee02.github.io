<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 300" role="img" aria-labelledby="t">
<title id="t">The ReAct cycle. Reason: the model reads everything so far and decides. If it asks for a tool, that is Act, a tool call. The tool result, a ToolMessage, is the Observation, which goes back to Reason. When the model replies with no tool calls, the loop ends with the answer.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="650" height="298" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="40" y="116" width="190" height="76" rx="10" fill="#eef0fe" stroke="#1f2de6" stroke-width="1.5"/><text x="135" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1a24b8" text-anchor="middle">Reason</text><text x="135" y="159" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the model reads it all</text><text x="135" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">and decides</text><path d="M230 136Q320 50 410 92" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="318" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">asks for a tool</text><rect x="412" y="56" width="200" height="70" rx="10" fill="#e9f7ef" stroke="#15803d" stroke-width="1.5"/><text x="512" y="86.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#14532d" text-anchor="middle">Act</text><text x="512" y="105.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">a tool call runs</text><path d="M512 126L512 182" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="412" y="184" width="200" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="512" y="214.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Observe</text><text x="512" y="233.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle">the result: a <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">ToolMessage</tspan></text><path d="M412 230Q320 262 232 178" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="318" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">goes back to the model</text><path d="M135 192L135 236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="135" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1a24b8" text-anchor="middle">no tool calls: the answer</text>
</svg>
