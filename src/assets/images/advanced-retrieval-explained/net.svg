<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t">
  <title id="t">Three panels. First, all your chunks: three good ones mixed among many unhelpful ones. Second, hybrid search casts a wide net that catches all three good chunks plus some junk, which is high recall. Third, the reranker keeps only the three good chunks, which is high precision.</title>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #1e293b; font-size: 13px; }
    .h { font-weight: 700; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 12px; }
    .mut { fill: #64748b; font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
    <g id="dots">
      <g fill="#cbd5e1">
        <circle cx="30" cy="170" r="7" /><circle cx="85" cy="96" r="7" /><circle cx="120" cy="110" r="7" />
        <circle cx="175" cy="105" r="7" /><circle cx="170" cy="200" r="7" /><circle cx="40" cy="215" r="7" />
        <circle cx="130" cy="215" r="7" /><circle cx="185" cy="160" r="7" /><circle cx="70" cy="160" r="7" />
        <circle cx="110" cy="160" r="7" />
      </g>
      <g fill="#f59e0b" stroke="#b45309" stroke-width="1.5">
        <circle cx="50" cy="120" r="7" /><circle cx="140" cy="140" r="7" /><circle cx="95" cy="200" r="7" />
      </g>
    </g>
  </defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#ffffff" stroke="#e2e8f0" />
  <text x="24" y="34" class="h">Wide net first (recall), then pick carefully (precision)</text>

  <!-- panel 1 -->
  <rect x="24" y="56" width="208" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="128" y="78" text-anchor="middle" class="b">All your chunks</text>
  <use href="#dots" x="24" />
  <text x="128" y="258" text-anchor="middle" class="s">3 good ones hidden</text>
  <text x="128" y="274" text-anchor="middle" class="s">among many others</text>

  <!-- panel 2 -->
  <rect x="256" y="56" width="208" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="360" y="78" text-anchor="middle" class="b">Wide net</text>
  <use href="#dots" x="256" />
  <ellipse cx="351" cy="160" rx="78" ry="58" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" />
  <text x="360" y="258" text-anchor="middle" class="s">hybrid search catches all 3,</text>
  <text x="360" y="274" text-anchor="middle" class="b s" style="fill:#6d28d9">plus junk: high recall</text>

  <!-- panel 3 -->
  <rect x="488" y="56" width="208" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="592" y="78" text-anchor="middle" class="b">Pick carefully</text>
  <g fill="#f59e0b" stroke="#b45309" stroke-width="1.5">
    <circle cx="552" cy="130" r="9" /><circle cx="592" cy="130" r="9" /><circle cx="632" cy="130" r="9" />
  </g>
  <text x="592" y="160" text-anchor="middle" class="s">kept</text>
  <g fill="#cbd5e1" opacity="0.5">
    <circle cx="542" cy="196" r="6" /><circle cx="567" cy="196" r="6" /><circle cx="592" cy="196" r="6" />
    <circle cx="617" cy="196" r="6" /><circle cx="642" cy="196" r="6" />
  </g>
  <text x="592" y="222" text-anchor="middle" class="mut">tossed</text>
  <text x="592" y="258" text-anchor="middle" class="s">the reranker keeps just the 3,</text>
  <text x="592" y="274" text-anchor="middle" class="b s" style="fill:#b45309">no junk: high precision</text>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)">
    <line x1="234" y1="146" x2="254" y2="146" />
    <line x1="466" y1="146" x2="486" y2="146" />
  </g>

  <text x="360" y="304" text-anchor="middle" class="mut">If the net misses a good chunk, the reranker can never get it back.</text>
</svg>
